  charIdxElB.textContent = String(currentCharB + 1).padStart(2, '0') + '/' + String(CHARACTERS.length).padStart(2, '0');
}

charSelB.addEventListener('change', e => pickCharacterB(parseInt(e.target.value, 10)));
charPrevB.addEventListener('click', () => pickCharacterB(currentCharB - 1));
charNextB.addEventListener('click', () => pickCharacterB(currentCharB + 1));

pickCharacter(0);

// Arm-hang defaults — tuned so forearm cylinder doesn't penetrate torso.
// Tightest spot: at forearm midpoint (y_spine ≈ 0.07) torso radius ≈ 0.235;
// forearm half-thickness 0.082; arm origin at SX=0.46. Even with rSh.z=-0.06
// the inner edge sits at ~0.310, leaving ~0.075 clearance.
const ARM_HANG_Z = 0.06;
const ARM_HANG_ELB = 0.0;

function resetPose() {
  ALL_GROUPS.forEach(g => g.rotation.set(0,0,0));
  root.position.set(0, BASE_Y, 0);
  rSh.rotation.z = -ARM_HANG_Z;
  lSh.rotation.z =  ARM_HANG_Z;
  rElb.rotation.x = ARM_HANG_ELB;
  lElb.rotation.x = ARM_HANG_ELB;
}

function resetPoseFor(P, baseX, baseZ, baseRotY) {
  P.allGroups.forEach(g => g.rotation.set(0,0,0));
  P.root.position.set(baseX, P.baseY, baseZ);
  P.root.rotation.y = baseRotY;
  P.rSh.rotation.z = -ARM_HANG_Z;
  P.lSh.rotation.z =  ARM_HANG_Z;
  P.rElb.rotation.x = ARM_HANG_ELB;
  P.lElb.rotation.x = ARM_HANG_ELB;
}

// ── Idle ──
// ── Idle ──
// Standing relaxed with subtle breathing, weight shift, and natural elbow flex.
// CONVENTION FIX: rElb.x NEGATIVE = forearm flexes FORWARD (anatomically correct).
function animIdle(t) {
  const b = Math.sin(t * 0.85);
  root.position.y = BASE_Y + b * 0.022;
  neckGrp.rotation.y = Math.sin(t * 0.3) * 0.09;
  neckGrp.rotation.x = Math.sin(t * 0.5) * 0.04;
  spine.rotation.z = Math.sin(t * 0.42) * 0.03;
  rHip.rotation.z =  Math.sin(t * 0.42) * 0.06;
  lHip.rotation.z = -Math.sin(t * 0.42) * 0.06;
  // Forward flex (~7°) — the natural carrying-angle bend of a relaxed arm
  rElb.rotation.x = -0.12 - Math.sin(t * 0.6) * 0.04;
  lElb.rotation.x = -0.12 - Math.sin(t * 0.7) * 0.04;
}

// ── Walk ──
// Per gait research: hip flex ±25° (≈0.40 rad), knee flex peaks at MID-SWING
// (not toe-off) up to ~60°, arms swing ±20° opposite to legs, elbow held at
// slight forward flex (~12° = -0.20 rad).
function animWalk(t) {
  const sp = 2.5;
  const ph = t * sp;
  const r = Math.sin(ph), l = -r;

  // Hip flexion: positive = leg behind. ±0.42 rad ≈ ±24° matches gait literature
  rHip.rotation.x = r * 0.42;
  lHip.rotation.x = l * 0.42;

  // Knee flex peaks at MID-SWING, not at toe-off.
  // For r-leg: swing is when r decreases from +1 → -1, mid-swing at ph=π
  //   → -cos(ph) peaks at +1 there. For l-leg use +cos(ph).
  rKn.rotation.x = Math.max(0, -Math.cos(ph)) * 1.05;
  lKn.rotation.x = Math.max(0,  Math.cos(ph)) * 1.05;

  // Arm swing opposite to legs (±0.32 rad ≈ ±18°)
  rSh.rotation.x = -r * 0.32; rSh.rotation.z = -ARM_HANG_Z;
  lSh.rotation.x = -l * 0.32; lSh.rotation.z =  ARM_HANG_Z;
  // Elbow held at slight forward flex (NEGATIVE = anatomical forward direction)
  rElb.rotation.x = -0.22;
  lElb.rotation.x = -0.22;

  // Body bounces twice per stride; chest counter-rotates against hips
  root.position.y = BASE_Y + Math.abs(Math.sin(ph * 2)) * 0.035;
  spine.rotation.y = -r * 0.06;
  // Plantar push-off when leg is behind body
  rAnk.rotation.x = Math.max(0,  r) * 0.18;
  lAnk.rotation.x = Math.max(0,  l) * 0.18;
}

// ── Wave ──
// Right arm raised diagonally up-and-out with forearm bent forward so the hand
// sits near face height. The whole arm sweeps side-to-side at the shoulder
// (windshield-wiper motion) — this is what produces the *visible* wave; trying
// to twist at the elbow's local Y leaves the hand on the rotation axis and
// produces almost no apparent movement.
function animWave(t) {
  animIdle(t);
  const sp = 3.4;
  const sw = Math.sin(t * sp);
  // Upper arm raised ~145° around z (well above horizontal) and sweeps ±18°.
  rSh.rotation.z = 2.55 + sw * 0.32;
  rSh.rotation.x = -0.18;
  rSh.rotation.y = 0;
  // Forearm flexed ~75° forward; tiny breathing oscillation for life
  rElb.rotation.x = -1.30 + Math.sin(t * sp * 0.5) * 0.06;
  rElb.rotation.y = 0;
  rElb.rotation.z = 0;
  // Left arm relaxed
  lSh.rotation.z = ARM_HANG_Z;
  lSh.rotation.x = 0;
  lElb.rotation.x = -0.10;
  lElb.rotation.y = 0;
  lElb.rotation.z = 0;
}

// ── Dance ──
// Elbow direction flipped to NEGATIVE so forearms angle forward (anatomical).
function animDance(t) {
  const sp = 4.5;
  const beat = Math.pow(Math.abs(Math.sin(t * sp * 0.5)), 0.5);
  root.rotation.y = Math.sin(t*sp*0.5)*0.38;
  root.rotation.z = Math.sin(t*sp)*0.09;
  root.position.y = BASE_Y + beat * 0.14;
  root.position.x = Math.sin(t*sp*0.25)*0.18;
  spine.rotation.z = Math.sin(t*sp*0.5)*0.14;
  spine.rotation.y = Math.sin(t*sp*0.6)*0.16;
  spine.rotation.x = -beat * 0.12;
  neckGrp.rotation.y = Math.sin(t*sp)*0.25;
  neckGrp.rotation.z = Math.sin(t*sp*1.2)*0.08;
  neckGrp.rotation.x = -beat * 0.15;
  // Arms abduct OUT (positive z for right, negative for left) — flipped from
  // the previous "cross-body" pattern that depended on the broken clamp
  rSh.rotation.z =  0.55 + Math.sin(t*sp)*0.58;
  lSh.rotation.z = -0.55 - Math.sin(t*sp+Math.PI)*0.58;
  rSh.rotation.x =  Math.cos(t*sp)*0.42;
  lSh.rotation.x = -Math.cos(t*sp)*0.42;
  // Forearms flex FORWARD (negative rElb.x)
  rElb.rotation.x = -0.7 - Math.sin(t*sp*1.4)*0.32;
  lElb.rotation.x = -0.7 - Math.sin(t*sp*1.4+1)*0.32;
  rElb.rotation.z = Math.sin(t*sp*2)*0.22;
  lElb.rotation.z = Math.sin(t*sp*2+1.2)*0.22;
  rHip.rotation.x = Math.sin(t*sp)*0.32;
  lHip.rotation.x = -Math.sin(t*sp)*0.32;
  rHip.rotation.z = Math.sin(t*sp*0.5+0.5)*0.12;
  lHip.rotation.z = -Math.sin(t*sp*0.5+0.5)*0.12;
  rKn.rotation.x = Math.max(0, Math.sin(t*sp+0.9))*0.55;
  lKn.rotation.x = Math.max(0, Math.sin(t*sp+0.9+Math.PI))*0.55;
  rAnk.rotation.x = Math.sin(t*sp*1.5)*0.18;
  lAnk.rotation.x = Math.sin(t*sp*1.5+1)*0.18;
}

// ── Run ──
// Real running form: elbow held at ~90° flex FORWARD (rElb.x ≈ -1.3 rad),
// upper-arm pumps ±30°, knees lift higher than walk (~75°), forward torso
// lean. Knee flex peaks at mid-swing per gait research.
function animRun(t) {
  const sp = 5.0;
  const ph = t * sp;
  const r = Math.sin(ph), l = -r;

  // Hip ±0.65 rad ≈ ±37° (sprint range)
  rHip.rotation.x = r * 0.65;
  lHip.rotation.x = l * 0.65;
  // Knee max flex at mid-swing, ~80°
  rKn.rotation.x = Math.max(0, -Math.cos(ph)) * 1.40;
  lKn.rotation.x = Math.max(0,  Math.cos(ph)) * 1.40;

  // Arm pump ±30°
  rSh.rotation.x = -r * 0.55; rSh.rotation.z = -ARM_HANG_Z;
  lSh.rotation.x = -l * 0.55; lSh.rotation.z =  ARM_HANG_Z;
  // Elbow held at ~75° forward flex with slight pump on stride beat
  rElb.rotation.x = -1.30 + r * 0.15;
  lElb.rotation.x = -1.30 + l * 0.15;

  root.position.y = BASE_Y + Math.abs(Math.sin(ph * 2)) * 0.07;
  root.rotation.x = -0.08;
  spine.rotation.y = -r * 0.10;
  spine.rotation.x = -0.06;
  neckGrp.rotation.x = 0.08;
  rAnk.rotation.x = Math.max(0,  r) * 0.30;
  lAnk.rotation.x = Math.max(0,  l) * 0.30;
}

// ── Break ──────────────────────────────────────────────────
const ss = x => x*x*(3-2*x);
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a,b,t) => a+(b-a)*ss(clamp01(t));

// Phase 1: Toprock  (0 – 3.5s)
function breakToprock(t, lt) {
  const sp = 3.2;
  const beat = Math.abs(Math.sin(t * sp)); // 0-1 on beat

  // Body bounce — sharp hit on beat
  root.position.y = BASE_Y + Math.pow(beat, 3) * 0.14;
  root.position.x = Math.sin(t * sp * 0.5) * 0.3;

  // Chest pop on beat
  spine.rotation.x = -beat * 0.18;
  spine.rotation.z = Math.sin(t * sp) * 0.18;
  spine.rotation.y = Math.sin(t * sp * 0.6) * 0.22;

  // Head with attitude — nods hard on beat, looks side to side
  neckGrp.rotation.x = -beat * 0.22;
  neckGrp.rotation.y = Math.sin(t * sp * 0.5) * 0.35;
  neckGrp.rotation.z = Math.sin(t * sp * 0.9) * 0.08;

  // Sharp cross-step footwork
  const rs = Math.sin(t * sp), ls = -Math.sin(t * sp);
  rHip.rotation.x =  rs * 0.62;
  lHip.rotation.x =  ls * 0.62;
  rHip.rotation.z =  Math.sin(t * sp * 0.5) * 0.18;
  lHip.rotation.z = -Math.sin(t * sp * 0.5) * 0.18;
  rKn.rotation.x  = Math.max(0,  rs) * 0.85;
  lKn.rotation.x  = Math.max(0, -rs) * 0.85;
  rAnk.rotation.x = Math.sin(t * sp + 0.5) * 0.2;
  lAnk.rotation.x = Math.sin(t * sp - 0.5) * 0.2;

  // Arms: forearms held high at chest level (classic hip-hop guard stance),
  // shoulders alternate forward swings on the beat. Less abducted than before
  // so the silhouette isn't a stiff T-pose.
  rSh.rotation.z = -0.18 + Math.sin(t * sp + 0.3) * 0.18;
  lSh.rotation.z =  0.18 + Math.sin(t * sp + 0.3 + Math.PI) * 0.18;
  rSh.rotation.x =  Math.cos(t * sp) * 0.55;
  lSh.rotation.x = -Math.cos(t * sp) * 0.55;
  // Heavy forearm flex (~80°) — forearms come up in front of the chest
  rElb.rotation.x = -1.40 - Math.sin(t * sp * 1.8) * 0.20;
  lElb.rotation.x = -1.40 - Math.cos(t * sp * 1.8) * 0.20;
  // Subtle wrist roll on beat
  rElb.rotation.z = Math.sin(t * sp * 2) * 0.18;
  lElb.rotation.z = Math.sin(t * sp * 2 + 1) * 0.18;
}

// Phase 2: Windmill  (2.5 – 6s = 3.5s)
// Body lies on its back; root.rotation.y becomes a roll around the body's
// long axis (because rotation.x already laid the body flat under XYZ Euler
// order). Legs are held in a wide static V — the body's roll itself sweeps
// them through the air like helicopter blades, so we don't pump hip.x
// (which used to swing legs through the floor).
function breakWindmill(t, lt) {
  const spinAngle = lt * (Math.PI * 6 / 3.5);   // 3 full rolls in 3.5s
  const dropIn = clamp01(lt * 5);

  root.position.y = lerp(BASE_Y, 0.10, dropIn);
  root.position.x = 0;

  // Body fully on its back, then keep rolling. Tiny x oscillation gives the
  // shoulder-to-shoulder rocking feel without breaking ground contact.
  root.rotation.x = lerp(0, -Math.PI / 2 + 0.05, dropIn) + Math.sin(spinAngle) * 0.06;
  root.rotation.y = spinAngle;
  root.rotation.z = 0;

  // LEGS: wide V-spread, knees slightly bent, ankles pointed. The body's
  // roll does the actual sweeping; legs stay rigid in body-local frame.
  const spread = 0.95 + Math.sin(spinAngle * 0.5) * 0.08;
  rHip.rotation.x = 0.10;
  lHip.rotation.x = 0.10;
  rHip.rotation.z =  spread;
  lHip.rotation.z = -spread;
  rKn.rotation.x = 0.12 + Math.sin(spinAngle * 1.1) * 0.05;
  lKn.rotation.x = 0.12 + Math.sin(spinAngle * 1.1 + Math.PI) * 0.05;
  rAnk.rotation.x = 0.05;
  lAnk.rotation.x = 0.05;

  // ARMS: held wide for balance; one near-floor "anchor", the other up.
  // Holding them roughly horizontal in body-local frame keeps them swinging
  // safely above the body during roll instead of stabbing into the floor.
  rSh.rotation.z = -0.55;
  lSh.rotation.z =  0.55;
  rSh.rotation.x =  Math.cos(spinAngle) * 0.30;
  lSh.rotation.x = -Math.cos(spinAngle) * 0.30;
  rElb.rotation.x = -0.55;
  lElb.rotation.x = -0.55;

  spine.rotation.x = Math.sin(spinAngle * 0.7) * 0.10;
  neckGrp.rotation.y = -spinAngle * 0.25;
  neckGrp.rotation.x = 0.08;
}

// Phase 3: Headspin  (6 – 9.5s = 3.5s)
// Strategy: root.rotation.x ≈ -π  →  body inverted, head at floor
// root.position.y = 1.60  →  head world-y ≈ 0.07
// root.rotation.y = continuous spin  →  body circles around head
function breakHeadspin(t, lt) {
  const spinSpeed = 6.5; // rad/s — about 1 rotation/second
  const spinAngle = lt * spinSpeed;
  const spinIn = clamp01(lt * 3.5);

  // Continuity with windmill end: start at body-on-back (y≈0.10, rot.x≈-π/2)
  // and rotate the rest of the way past vertical-up into full inversion.
  root.position.y = lerp(0.10, 1.60, spinIn);
  root.rotation.x = lerp(-Math.PI / 2 + 0.05, -(Math.PI - 0.22), spinIn);
  root.rotation.y = spinAngle;
  root.rotation.z = Math.sin(spinAngle * 0.12) * 0.05; // tiny precession wobble

  // LEGS: V-spread upward  (in inverted frame local-down = world-up)
  const spread = 0.65 + Math.sin(lt * 2.8) * 0.14;
  rHip.rotation.z =  spread;
  lHip.rotation.z = -spread;
  rHip.rotation.x = Math.sin(lt * 3.2 + 0.4) * 0.28;
  lHip.rotation.x = Math.sin(lt * 3.2 + 0.4 + Math.PI) * 0.28;
  rKn.rotation.x = 0.28 + Math.sin(lt * 4.5) * 0.12;
  lKn.rotation.x = 0.28 + Math.sin(lt * 4.5 + Math.PI) * 0.12;
  rAnk.rotation.x = Math.sin(lt * 5) * 0.15;
  lAnk.rotation.x = Math.sin(lt * 5 + 1.2) * 0.15;

  // ARMS: spread for angular momentum control
  rSh.rotation.z = -0.52 + Math.sin(spinAngle * 0.35) * 0.18;
  lSh.rotation.z =  0.52 + Math.sin(spinAngle * 0.35 + 1.1) * 0.18;
  rSh.rotation.x = Math.sin(spinAngle * 0.22) * 0.22;
  lSh.rotation.x = Math.cos(spinAngle * 0.22) * 0.22;
  rElb.rotation.x = -0.32 - Math.sin(lt * 2) * 0.1;
  lElb.rotation.x = -0.32 - Math.sin(lt * 2 + 1) * 0.1;

  // Head: trails spin slightly, slight strain tilt
  neckGrp.rotation.y = -spinAngle * 0.04;
  neckGrp.rotation.x = 0.08;
  spine.rotation.z = Math.sin(spinAngle * 0.18) * 0.07;
}

// Phase 4: Air Chair Freeze  (9.5 – 11.5s = 2s)
// Right arm acts as a vertical support pole; right hand is pinned to floor by
// pinNodeToFloor(rHnd) in animBreak, so the choreography only needs to leave
// the hand directly below the shoulder for a believable single-arm balance.
function breakFreeze(t, lt) {
  // Snap-out from inversion happens fast (real freezes pop into place).
  // 0.18s un-inversion keeps the moment visually crisp and avoids a long
  // window where the pin yanks the half-inverted body below the floor.
  const fi = clamp01(lt * 5.5);

  root.position.y = lerp(1.60, 0.85, fi); // come down from inverted
  root.rotation.y = 0; // STOP spinning — freeze!
  root.rotation.x = lerp(-(Math.PI - 0.22), -0.20, fi);
  root.rotation.z = lerp(0, 0.32, fi);    // mild right lean

  // RIGHT arm: nearly straight down — the support pole.
  rSh.rotation.z = lerp(-0.52, -0.32, fi);
  rSh.rotation.x = lerp(0.22, 0.0, fi);
  rElb.rotation.x = lerp(-0.32, -0.18, fi);
  rElb.rotation.z = 0;

  // LEFT arm: dramatic counterbalance — reach up and out.
  lSh.rotation.z = lerp(0.52, 1.45, fi);
  lSh.rotation.x = lerp(0.22, -0.30, fi);
  lElb.rotation.x = lerp(-0.32, -0.18, fi);
  lElb.rotation.z = lerp(0, -0.20, fi);

  // RIGHT leg: kicked high and forward — visible silhouette of the freeze.
  rHip.rotation.x = lerp(0.28, 1.55, fi);
  rHip.rotation.z = lerp(0.65, -0.05, fi);
  rKn.rotation.x  = lerp(0.28, 0.32, fi);

  // LEFT leg: tucked tight — knee folded almost flat so the foot rides
  // close to the butt instead of dropping below the floor.
  lHip.rotation.x = lerp(-0.28, -0.05, fi);
  lHip.rotation.z = lerp(-0.65, -0.40, fi);
  lKn.rotation.x  = lerp(0.28,  2.10, fi);
  lAnk.rotation.x = lerp(0.15,  0.10, fi);

  spine.rotation.x = lerp(0, -0.08, fi);
  spine.rotation.z = lerp(0, -0.14, fi);

  // Hold strain: micro-shake grows over time
  const strain = clamp01((lt - 0.4) * 1.5);
  const wobble = (Math.sin(t * 11.3) * 0.014 + Math.sin(t * 7.1) * 0.008) * strain;
  spine.rotation.z  += wobble;
  neckGrp.rotation.y = wobble * 3.0;
  neckGrp.rotation.x = 0.10 + Math.sin(t * 6.5) * 0.03 * strain;
  rSh.rotation.x    += wobble * 1.5;
}

// Phase 5: Get Up  (11.5 – 14s = 2.5s)
// Start values must match the new freeze rest pose so the transition is smooth.
function breakGetUp(t, lt) {
  const ui = clamp01(lt / 1.8);

  root.position.y = lerp(0.85, BASE_Y + 0.14, ui);
  root.rotation.x = lerp(-0.20, 0.04, ui);
  root.rotation.z = lerp(0.32, 0, ui);

  rSh.rotation.z = lerp(-0.32, -0.52, ui);
  lSh.rotation.z = lerp( 1.45,  0.52, ui);
  rSh.rotation.x = lerp(0.0,  0.22, ui);
  lSh.rotation.x = lerp(-0.30, 0.22, ui);
  rElb.rotation.x = lerp(-0.18, -0.55, ui);
  lElb.rotation.x = lerp(-0.18, -0.55, ui);

  rHip.rotation.x = lerp(1.55,  0.1, ui);
  lHip.rotation.x = lerp(-0.05, -0.1, ui);
  rKn.rotation.x  = lerp(0.32,  0.08, ui);
  lKn.rotation.x  = lerp(2.10,  0.08, ui);
  spine.rotation.x = lerp(-0.08, -0.12, ui);

  if (ui > 0.65) {
    const b = (ui - 0.65) / 0.35;
    const sp = 3.2, beat = Math.abs(Math.sin(t * sp));
    root.position.y = lerp(root.position.y, BASE_Y + Math.pow(beat, 3) * 0.14, b);
    spine.rotation.z = Math.sin(t * sp) * 0.18 * b;
    neckGrp.rotation.x = -beat * 0.22 * b;
    neckGrp.rotation.y = Math.sin(t * sp * 0.5) * 0.35 * b;
  }
}

// ─── TENNIS RALLY SYSTEM ────────────────────────────────────
// Real two-player rally: ball physics (gravity + bounce + drag),
// six shot types (flat / topspin / slice / lob / drop / cross),
// AI predicts ball intercept + runs to it, swings on contact,
// scoring with HUD. Both players animated with run-in-place when
// chasing and a state-driven swing when striking.
// ────────────────────────────────────────────────────────────

const COURT = {
  HALF_W: 2.4, HALF_L: 4.2,
  NET_H: 0.95, NET_HALFW: 2.55,
  BALL_R: 0.060,
  GRAV: 9.81, BOUNCE: 0.62, DRAG: 0.999,
  RACKET_REACH: 1.10,
  STRIKE_Y_MIN: 0.32, STRIKE_Y_MAX: 2.05,
};

// ─── COURT VISUALS ──────────────────────────────────────────
let courtGroup = null;
function buildCourt() {
  if (courtGroup) return;
  courtGroup = new THREE.Group();

  // Court surface tint
  const surfMat = new THREE.MeshPhongMaterial({ color: 0x0a2230, shininess: 8 });
  const surf = new THREE.Mesh(
    new THREE.PlaneGeometry(COURT.HALF_W * 2 + 0.6, COURT.HALF_L * 2 + 0.6),
    surfMat
  );
  surf.rotation.x = -Math.PI / 2;
  surf.position.y = 0.005;
  surf.receiveShadow = true;
  courtGroup.add(surf);

  // Lines (bright cyan)
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.55 });
  const line = (w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.012, d), lineMat);
    m.position.set(x, 0.012, z);
    courtGroup.add(m);
  };
  // Outer rectangle
  line(COURT.HALF_W * 2 + 0.06, 0.04, 0,  COURT.HALF_L);
  line(COURT.HALF_W * 2 + 0.06, 0.04, 0, -COURT.HALF_L);
  line(0.04, COURT.HALF_L * 2, -COURT.HALF_W, 0);
  line(0.04, COURT.HALF_L * 2,  COURT.HALF_W, 0);
  // Service box (mid-court)
  line(COURT.HALF_W * 2, 0.03, 0,  COURT.HALF_L * 0.5);
  line(COURT.HALF_W * 2, 0.03, 0, -COURT.HALF_L * 0.5);
  line(0.03, COURT.HALF_L,       0, 0);

  // Net
  const postMat = mkMat(0x222426, 80);
  for (const x of [-COURT.NET_HALFW, COURT.NET_HALFW]) {
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.045, COURT.NET_H + 0.08),
      postMat
    );
    post.position.set(x, (COURT.NET_H + 0.08) / 2, 0);
    post.castShadow = true;
    courtGroup.add(post);
  }
  const netCloth = new THREE.Mesh(
    new THREE.PlaneGeometry(COURT.NET_HALFW * 2, COURT.NET_H),
    new THREE.MeshBasicMaterial({
      color: 0xddeeff, transparent: true, opacity: 0.18, side: THREE.DoubleSide,
      depthWrite: false,
    })
  );
  netCloth.position.set(0, COURT.NET_H / 2, 0);
  courtGroup.add(netCloth);
  const band = new THREE.Mesh(
    new THREE.BoxGeometry(COURT.NET_HALFW * 2, 0.03, 0.04),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  band.position.set(0, COURT.NET_H, 0);
  courtGroup.add(band);

  courtGroup.visible = false;
  scene.add(courtGroup);
}
buildCourt();

// ─── BALL ────────────────────────────────────────────────────
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(COURT.BALL_R, 18, 14),
  new THREE.MeshPhongMaterial({ color: 0xddff44, emissive: 0x3a4400, shininess: 90 })
);
ballMesh.castShadow = true;
ballMesh.visible = false;
scene.add(ballMesh);

// Shadow blob — a cheap dark disc that follows the ball's XZ on the floor.
// Reads as a real shadow even in fog without needing high-res shadow maps.
const ballShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.14, 20),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55, depthWrite: false })
);
ballShadow.rotation.x = -Math.PI / 2;
ballShadow.visible = false;
scene.add(ballShadow);

const ball = {
  pos: new THREE.Vector3(),
  vel: new THREE.Vector3(),
  alive: false,
  bounces: 0,
  hitter: null,        // 'A' | 'B' | null
  spinAxis: new THREE.Vector3(1, 0, 0),
  spinRate: 0,
  // While serving=true the ball is driven by the toss animation, not physics —
  // it tracks the server's left hand, then arcs up under gravity, then snaps
  // to the racket sweet-spot at strike time and gets its serve velocity.
  serving: false,
};

// ─── PLAYER RALLY STATE ─────────────────────────────────────
function makeRallyState(side) {
  return {
    side,                                // +1 (A on +z) or -1 (B on -z)
    pos: new THREE.Vector3(0, 0, side * 3.6),
    facing: side > 0 ? Math.PI : 0,      // A faces -z, B faces +z
    targetX: 0, targetZ: side * 3.6,
    speed: 0, runPhase: 0,
    swingT0: -1,
    swingShot: null,
    swingTarget: null,
    contactDone: false,
    feedT: -1,                            // for "watch the bounce" head tracking
    // Serve animation state — independent of swingT0 so a server can be
    // mid-serve while the rest of the rig stays in a different pose path.
    serveT0: -1,
    serveTarget: null,
    serveReleasePos: new THREE.Vector3(),
    serveStruck: false,
  };
}

// Real tennis scoring: each rally point feeds a game (0-15-30-40-game),
// games feed a set (first to 4 games wins; 3-3 → tiebreak by next point),
// the match ends after one set (best-of-1) so a casual viewer sees a
// completed match in a few minutes. Reset by re-entering tennis mode.
const SET_TARGET = 4;
const tennisGame = {
  A: makeRallyState(+1),
  B: makeRallyState(-1),
  pointsA: 0, pointsB: 0,    // current game's points (0,1,2,3 = 0,15,30,40)
  gamesA: 0,  gamesB: 0,
  serveBy: 'A',
  rallyEndsAt: -1,
  lastShotName: '',
  lastShotEnd: '',
  matchOver: false,
  matchWinner: null,
};

// ─── SHOT TYPES ─────────────────────────────────────────────
//   apex   = peak height of arc above ground (m)
//   deepZ  = absolute z of intended bounce (deeper = closer to opponent's baseline)
//   latX   = max lateral offset of bounce (-latX..+latX, random)
const SHOT_PROFILES = {
  flat:    { apex: 1.30, deepZ: 3.4, latX: 1.7, weight: 22 },
  topspin: { apex: 2.30, deepZ: 3.6, latX: 1.6, weight: 28 },
  slice:   { apex: 1.25, deepZ: 3.1, latX: 1.8, weight: 16 },
  lob:     { apex: 4.40, deepZ: 3.6, latX: 1.4, weight: 10 },
  drop:    { apex: 1.65, deepZ: 0.9, latX: 1.5, weight: 12 },
  cross:   { apex: 1.65, deepZ: 2.2, latX: 2.1, weight: 12 },
};
const SHOT_NAMES = Object.keys(SHOT_PROFILES);

// Position-aware shot picker: drop and lob are rare from deep court
// (would either die in the net or sail long).
function pickShot(P) {
  const deep = P ? Math.abs(P.pos.z) > 3.0 : false;
  let total = 0;
  const w = {};
  for (const name of SHOT_NAMES) {
    let weight = SHOT_PROFILES[name].weight;
    if (deep && (name === 'drop' || name === 'lob')) weight *= 0.35;
    if (!deep && name === 'lob') weight *= 0.6;
    w[name] = weight;
    total += weight;
  }
  let r = Math.random() * total;
  for (const name of SHOT_NAMES) {
    r -= w[name];
    if (r <= 0) return name;
  }
  return 'flat';
}

// Initial velocity that takes ball from p0 to ground point (xT, 0, zT) with peak height = apex.
// Solves: yPeak = y0 + vy0²/(2g) → vy0 = sqrt(2g(peak − y0))
//         t_land = (vy0 + sqrt(vy0² + 2g·y0)) / g
function buildShotVelocity(p0, target, apex) {
  const g = COURT.GRAV;
  const peak = Math.max(apex, p0.y + 0.15);
  const vy0 = Math.sqrt(2 * g * (peak - p0.y));
  const T = (vy0 + Math.sqrt(vy0 * vy0 + 2 * g * Math.max(p0.y, 0))) / g;
  return new THREE.Vector3(
    (target.x - p0.x) / T,
    vy0,
    (target.z - p0.z) / T
  );
}

// Forward-simulate ball physics by `dtAhead` seconds. Returns predicted state.
const _simP = new THREE.Vector3(), _simV = new THREE.Vector3();
function predictBall(dtAhead, fromPos, fromVel, fromBounces) {
  _simP.copy(fromPos); _simV.copy(fromVel);
  let bounced = fromBounces > 0;
  const step = 1 / 120;
  const N = Math.max(1, Math.ceil(dtAhead / step));
  for (let i = 0; i < N; i++) {
    _simV.y -= COURT.GRAV * step;
    _simV.multiplyScalar(COURT.DRAG);
    _simP.addScaledVector(_simV, step);
    if (_simP.y <= COURT.BALL_R && _simV.y < 0) {
      _simP.y = COURT.BALL_R;
      _simV.y *= -COURT.BOUNCE;
      _simV.x *= 0.93; _simV.z *= 0.93;
      bounced = true;
    }
  }
  return { p: _simP.clone(), v: _simV.clone(), bounced };
}

// Predict where the receiving player should run: the descent-after-bounce
// position at strike height (~1.0m). Falls back to current ball XZ.
function predictIntercept(side) {
  const p = ball.pos.clone();
  const v = ball.vel.clone();
  let bounced = ball.bounces > 0;
  const step = 1 / 120;
  for (let i = 0; i < 600; i++) {
    v.y -= COURT.GRAV * step;
    v.multiplyScalar(COURT.DRAG);
    p.addScaledVector(v, step);
    if (p.y <= COURT.BALL_R && v.y < 0) {
      p.y = COURT.BALL_R;
      v.y *= -COURT.BOUNCE;
      v.x *= 0.93; v.z *= 0.93;
      bounced = true;
    }
    // Once on receiver's side AND descending through strike zone → that's our spot
    if (bounced && v.y < 0 && p.y < 1.10 && p.y > 0.55 && (p.z * side) > 0.4) {
      return { x: p.x, z: p.z };
    }
    // Pre-bounce volley window (if ball stays high)
    if (!bounced && (p.z * side) > 2.4 && p.y < 1.7 && p.y > 0.6) {
      return { x: p.x, z: p.z };
    }
    if (p.y < 0 && v.y < 0) break;
  }
  return { x: ball.pos.x, z: ball.pos.z };
}

// Approximate the racket sweet-spot in world space for player P.
// Stand-in: 0.4m forward of pelvis + 0.5m to dominant (right) side, at 1.0m height.
function computeRacketPos(P) {
  const f = P.facing;
  const fwdX = Math.sin(f), fwdZ = Math.cos(f);
  const rgtX =  Math.cos(f), rgtZ = -Math.sin(f);
  return new THREE.Vector3(
    P.pos.x + fwdX * 0.42 + rgtX * 0.52,
    1.05,
    P.pos.z + fwdZ * 0.42 + rgtZ * 0.52
  );
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * Math.max(0, Math.min(1, t));
}
const _clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// Move player toward target; updates pos, facing, runPhase, speed.
function movePlayer(P, dt) {
  const dx = P.targetX - P.pos.x;
  const dz = P.targetZ - P.pos.z;
  const d = Math.hypot(dx, dz);
  const FACE = P.side > 0 ? Math.PI : 0;
  if (d > 0.04) {
    // Smooth ramp: full speed when far, decelerate as we close in
    const v = Math.min(4.8, d * 5.0);
    P.speed = v;
    const stepMax = v * dt;
    const step = Math.min(stepMax, d);
    P.pos.x += (dx / d) * step;
    P.pos.z += (dz / d) * step;
    // Mostly face opponent; slight lean toward direction of motion
    const motionDir = Math.atan2(dx, dz);
    P.facing = lerpAngle(P.facing, lerpAngle(FACE, motionDir, 0.35), dt * 6);
    P.runPhase += v * dt * 2.6;
  } else {
    P.pos.x = P.targetX; P.pos.z = P.targetZ;
    P.speed *= Math.exp(-dt * 6);
    P.facing = lerpAngle(P.facing, FACE, dt * 7);
  }
  // Keep player on own side of the net (slight margin)
  const minZ = P.side > 0 ?  0.5 : -COURT.HALF_L - 1.2;
  const maxZ = P.side > 0 ?  COURT.HALF_L + 1.2 : -0.5;
  P.pos.z = _clamp(P.pos.z, minZ, maxZ);
  P.pos.x = _clamp(P.pos.x, -COURT.HALF_W - 1.6, COURT.HALF_W + 1.6);
}

// ─── SWING TIMING ───────────────────────────────────────────
// SWING_CONTACT marks the *pose* boundary between backswing and forward swing
// (peak coil). Actual ball impact happens later, at the apex of the forward
// swing when the racket is in front of the body — that's SWING_IMPACT.
const SWING_DURATION = 0.92;
const SWING_CONTACT  = 0.42;
const SWING_IMPACT   = 0.60;
const SWING_LOOKAHEAD = SWING_IMPACT;

function triggerSwing(P, t, name) {
  P.swingT0 = t;
  P.swingShot = pickShot(P);
  P.contactDone = false;
  // Pick target inside opponent's court
  const oppSide = -P.side;
  const sp = SHOT_PROFILES[P.swingShot];
  let tx = (Math.random() * 2 - 1) * Math.min(sp.latX, COURT.HALF_W * 0.92);
  let tz = oppSide * (sp.deepZ * (0.55 + Math.random() * 0.55));
  tx = _clamp(tx, -COURT.HALF_W * 0.94, COURT.HALF_W * 0.94);
  tz = oppSide > 0
    ? _clamp(tz,  0.4,  COURT.HALF_L * 0.96)
    : _clamp(tz, -COURT.HALF_L * 0.96, -0.4);
  P.swingTarget = { x: tx, z: tz, apex: sp.apex };
}

const _racketHit = new THREE.Vector3();
function resolveSwing(P, t, name) {
  if (P.swingT0 < 0) return;
  const lt = t - P.swingT0;
  if (!P.contactDone && lt >= SWING_IMPACT) {
    // Read the racket's *actual* world position at this exact frame so the
    // visual contact lines up with the geometry the player can see, instead
    // of a static offset estimate from the pelvis.
    const parts = (name === 'A') ? playerA : playerB;
    if (parts && parts.racket && parts.racket.userData.sweet) {
      scene.updateMatrixWorld(true);
      parts.racket.userData.sweet.getWorldPosition(_racketHit);
    } else {
      const est = computeRacketPos(P);
      _racketHit.set(est.x, est.y, est.z);
    }
    const dxz = Math.hypot(ball.pos.x - _racketHit.x, ball.pos.z - _racketHit.z);
    const yOK = ball.pos.y > 0.25 && ball.pos.y < 2.30;
    if (dxz < COURT.RACKET_REACH * 1.30 && yOK && ball.alive) {
      // Snap the ball to the racket head — visually the racket *is* striking
      // the ball, then the ball flies away on the new trajectory.
      ball.pos.copy(_racketHit);
      const target = new THREE.Vector3(P.swingTarget.x, COURT.BALL_R, P.swingTarget.z);
      const v = buildShotVelocity(ball.pos, target, P.swingTarget.apex);
      ball.vel.copy(v);
      ball.hitter = name;
      ball.bounces = 0;
      ball.spinAxis.set(-v.z, 0, v.x).normalize();
      ball.spinRate = (P.swingShot === 'topspin') ? 28
                    : (P.swingShot === 'slice')   ? -22
                    : 14;
      tennisGame.lastShotName = P.swingShot.toUpperCase();
      updateScoreHUD();
    }
    P.contactDone = true;
  }
  if (lt > SWING_DURATION) {
    P.swingT0 = -1;
    P.swingShot = null;
    P.swingTarget = null;
  }
}

function endRally(t, winner, reason) {
  // Award the point. If it closes a game, also award the game; check for set win.
  const wKey = (winner === 'A') ? 'pointsA' : 'pointsB';
  const lKey = (winner === 'A') ? 'pointsB' : 'pointsA';
  tennisGame[wKey]++;
  // Game closes when winner ≥ 4 AND leads by ≥ 2 (handles deuce/advantage).
  if (tennisGame[wKey] >= 4 && (tennisGame[wKey] - tennisGame[lKey]) >= 2) {
    if (winner === 'A') tennisGame.gamesA++; else tennisGame.gamesB++;
    tennisGame.pointsA = 0;
    tennisGame.pointsB = 0;
    // Server alternates each game (per real tennis), independent of who scored.
    tennisGame.serveBy = (tennisGame.gamesA + tennisGame.gamesB) % 2 === 0 ? 'A' : 'B';
    if (tennisGame.gamesA >= SET_TARGET || tennisGame.gamesB >= SET_TARGET) {
      tennisGame.matchOver = true;
      tennisGame.matchWinner = (tennisGame.gamesA > tennisGame.gamesB) ? 'A' : 'B';
    }
  } else {
    // Within a game, server stays the server.
    tennisGame.serveBy = tennisGame.serveBy;
  }
  tennisGame.rallyEndsAt = t + 1.6;
  tennisGame.lastShotEnd = reason;
  ball.alive = false;
  ball.serving = false;
  ball.vel.set(0, 0, 0);
  ballMesh.visible = false;
  ballShadow.visible = false;
  tennisGame.A.serveT0 = -1; tennisGame.A.serveStruck = false;
  tennisGame.B.serveT0 = -1; tennisGame.B.serveStruck = false;
  tennisGame.A.swingT0 = -1;
  tennisGame.B.swingT0 = -1;
  updateScoreHUD();
}

// ─── SERVE ANIMATION TIMING ─────────────────────────────────
// Real serve = toss + overhead strike. Phases over τ = t - serveT0:
//   [0, TOSS_RELEASE]  windup: both arms rise; ball tracks left hand.
//   [TOSS_RELEASE, STRIKE]  ball is in flight (gravity-only parabola)
//                           while right arm coils into trophy + explodes up.
//   [STRIKE, END]      racket meets ball overhead; ball gets serve velocity;
//                      right arm follows through across body.
// Timings tuned to Kovacs/Ellenbecker 8-stage model (PMC3445225):
//   - Trophy ends ~0.35s before contact.
//   - Peak external rotation ~0.09s before contact.
// Stance→contact ≈ 1.0s, follow-through adds ~0.55s.
const SERVE_TOSS_RELEASE = 0.25;
const SERVE_TROPHY_END   = 0.65;
const SERVE_STRIKE       = 1.00;
const SERVE_END          = 1.55;
// Toss velocity is computed per-serve in serveTick from the actual release
// height, so the ball converges on the racket's overhead position at STRIKE.
// Coaching consensus: peak should sit ~50cm above contact, struck on the way
// down (Tennis.com / Mouratoglou Academy).

function serveRally(t) {
  const server = tennisGame.serveBy;
  const S = tennisGame[server];
  // Place server on baseline center for the serve
  S.pos.x = 0; S.pos.z = S.side * 3.7;
  S.facing = S.side > 0 ? Math.PI : 0;
  S.targetX = S.pos.x; S.targetZ = S.pos.z;
  S.speed = 0;
  S.swingT0 = -1;

  // Random aimed serve into opponent's service box (front half of opp court)
  const oppSide = -S.side;
  const tx = (Math.random() * 2 - 1) * COURT.HALF_W * 0.78;
  const tz = oppSide * (1.4 + Math.random() * 1.6);
  const apex = 2.95 + Math.random() * 0.4;
  S.serveT0 = t;
  S.serveTarget = { x: tx, z: tz, apex };
  S.serveStruck = false;
  S.serveTossV0 = -1;          // computed once we know the actual release y

  // Ball starts in the server's left hand (will be re-snapped to the actual
  // hand world position each frame in serveTick once the rig is posed).
  ball.serving = true;
  ball.alive = true;
  ball.bounces = 0;
  ball.hitter = server;
  ball.vel.set(0, 0, 0);
  ball.spinRate = 0;
  ball.pos.set(S.pos.x, 1.10, S.pos.z);

  ballMesh.visible = true;
  ballShadow.visible = true;
  tennisGame.rallyEndsAt = -1;
  tennisGame.lastShotName = 'SERVE';
  tennisGame.lastShotEnd = '';
  updateScoreHUD();
}

// Drives the ball during the serve animation. Called only while ball.serving.
const _serveWorld = new THREE.Vector3();
function serveTick(t) {
  const server = tennisGame.serveBy;
  const S = tennisGame[server];
  const parts = (server === 'A') ? playerA : playerB;
  if (!parts) return;
  const tau = t - S.serveT0;

  if (tau < SERVE_TOSS_RELEASE) {
    // Ball glued to left hand as it lifts up for the toss
    parts.lHnd.getWorldPosition(_serveWorld);
    ball.pos.copy(_serveWorld);
    ball.pos.y += 0.06;        // sit just above the fingertips
    S.serveReleasePos.copy(ball.pos);
  } else if (tau < SERVE_STRIKE) {
    // Free-flight parabola from the release point. On the first flight frame,
    // solve v0 so the ball ends near the racket's overhead height at STRIKE —
    // this keeps the snap-to-racket teleport tiny regardless of how the toss
    // arm extended that frame. Per coaching consensus the peak should sit
    // ~50cm above contact, with the racket meeting a slightly falling ball.
    const flightT = tau - SERVE_TOSS_RELEASE;
    const rp = S.serveReleasePos;
    if (S.serveTossV0 < 0) {
      // Approximate racket-overhead height = baseY (≈1.79) + spine→shoulder
      // (~0.92) + arm length (1.21) − racket grip-to-sweet (0.62) ≈ 3.30m.
      const TARGET_Y = parts.baseY + 1.51;
      const T = SERVE_STRIKE - SERVE_TOSS_RELEASE;
      let v0 = (TARGET_Y - rp.y + 0.5 * COURT.GRAV * T * T) / T;
      // Ensure the ball actually goes UP first (peak above release point).
      v0 = _clamp(v0, 2.6, 6.0);
      S.serveTossV0 = v0;
    }
    // Drift slightly forward + center during flight so the ball lands above
    // the strike point rather than out at the toss-arm's extended position.
    const T_total = SERVE_STRIKE - SERVE_TOSS_RELEASE;
    const k = flightT / T_total;
    ball.pos.x = lerp(rp.x, S.pos.x, k);
    ball.pos.z = lerp(rp.z, S.pos.z + (-S.side) * 0.20, k);
    ball.pos.y = rp.y + S.serveTossV0 * flightT - 0.5 * COURT.GRAV * flightT * flightT;
  } else if (!S.serveStruck) {
    // Strike frame — snap ball to the racket sweet-spot, give it serve vel.
    if (parts.racket && parts.racket.userData.sweet) {
      parts.racket.userData.sweet.getWorldPosition(_serveWorld);
      ball.pos.copy(_serveWorld);
    }
    const target = { x: S.serveTarget.x, y: 0, z: S.serveTarget.z };
    const peak = Math.max(ball.pos.y + 0.08, S.serveTarget.apex);
    ball.vel.copy(buildShotVelocity(ball.pos, target, peak));
    ball.spinAxis.set(-ball.vel.z, 0, ball.vel.x).normalize();
    ball.spinRate = 32;
    ball.bounces = 0;
    S.serveStruck = true;
    ball.serving = false;        // physics tick takes over from next frame
  }
}

// ─── MAIN PER-FRAME RALLY UPDATE ───────────────────────────
function tennisTick(t, dt) {
  // Match concluded: stop serving, just leave both players standing in ready
  // pose so the final score on the HUD stays visible. Re-entering tennis mode
  // (or the TENNIS button) resets via tennisEnter.
  if (tennisGame.matchOver) {
    tennisGame.A.targetX = 0; tennisGame.A.targetZ =  3.7;
    tennisGame.B.targetX = 0; tennisGame.B.targetZ = -3.7;
    movePlayer(tennisGame.A, dt);
    movePlayer(tennisGame.B, dt);
    applyTennisPose(tennisGame.A, playerA, t);
    if (playerB) applyTennisPose(tennisGame.B, playerB, t);
    return;
  }
  // Between-rally pause: players walk back to baseline center
  if (tennisGame.rallyEndsAt > 0 && t < tennisGame.rallyEndsAt) {
    tennisGame.A.targetX = 0; tennisGame.A.targetZ =  3.7;
    tennisGame.B.targetX = 0; tennisGame.B.targetZ = -3.7;
    movePlayer(tennisGame.A, dt);
    movePlayer(tennisGame.B, dt);
    applyTennisPose(tennisGame.A, playerA, t);
    if (playerB) applyTennisPose(tennisGame.B, playerB, t);
    return;
  }
  if (!ball.alive) {
    serveRally(t);
    // Pose the rig before serveTick so lHnd's world matrix is fresh
    applyTennisPose(tennisGame.A, playerA, t);
    if (playerB) applyTennisPose(tennisGame.B, playerB, t);
    serveTick(t);
    ballMesh.position.copy(ball.pos);
    ballShadow.position.set(ball.pos.x, 0.01, ball.pos.z);
    const sh0 = _clamp(1 - ball.pos.y / 5, 0.25, 1);
    ballShadow.scale.setScalar(sh0);
    ballShadow.material.opacity = 0.55 * sh0;
    return;
  }
  if (ball.serving) {
    // Server holds, receiver waits in ready — no movement during the toss.
    tennisGame.A.targetX = tennisGame.A.pos.x; tennisGame.A.targetZ = tennisGame.A.pos.z;
    tennisGame.B.targetX = tennisGame.B.pos.x; tennisGame.B.targetZ = tennisGame.B.pos.z;
    movePlayer(tennisGame.A, dt);
    movePlayer(tennisGame.B, dt);
    applyTennisPose(tennisGame.A, playerA, t);
    if (playerB) applyTennisPose(tennisGame.B, playerB, t);
    serveTick(t);
    ballMesh.position.copy(ball.pos);
    ballShadow.position.set(ball.pos.x, 0.01, ball.pos.z);
    const sh1 = _clamp(1 - ball.pos.y / 5, 0.25, 1);
    ballShadow.scale.setScalar(sh1);
    ballShadow.material.opacity = 0.55 * sh1;
    return;
  }

  // ── Ball physics ──
  ball.vel.y -= COURT.GRAV * dt;
  ball.vel.multiplyScalar(COURT.DRAG);
  ball.pos.addScaledVector(ball.vel, dt);

  // Net collision (thin box at z=0, height 0..NET_H, width within posts)
  if (Math.abs(ball.pos.z) < 0.06 && ball.pos.y < COURT.NET_H && Math.abs(ball.pos.x) < COURT.NET_HALFW) {
    endRally(t, ball.hitter === 'A' ? 'B' : 'A', 'NET');
    return;
  }

  // Ground bounce
  if (ball.pos.y <= COURT.BALL_R && ball.vel.y < 0) {
    ball.pos.y = COURT.BALL_R;
    ball.vel.y *= -COURT.BOUNCE;
    ball.vel.x *= 0.93; ball.vel.z *= 0.93;
    ball.bounces++;

    if (ball.bounces === 1) {
      // First bounce judgement: must be in opponent's court for hitter's shot to be legal
      const ownerSide = (ball.hitter === 'A') ? +1 : -1;
      const inOppHalf = (ball.pos.z * ownerSide) < -0.05;
      const inLat = Math.abs(ball.pos.x) <= COURT.HALF_W + 0.04;
      const inDeep = Math.abs(ball.pos.z) <= COURT.HALF_L + 0.04;
      if (!inOppHalf || !inLat || !inDeep) {
        endRally(t, ball.hitter === 'A' ? 'B' : 'A', 'OUT');
        return;
      }
    } else if (ball.bounces >= 2) {
      // Second bounce → receiver missed → hitter scores
      endRally(t, ball.hitter, 'WIN');
      return;
    }
  }

  // Ball completely off court (sailed past back fence)
  if (Math.abs(ball.pos.z) > COURT.HALF_L + 4 || Math.abs(ball.pos.x) > COURT.HALF_W + 4) {
    endRally(t, ball.hitter === 'A' ? 'B' : 'A', 'OUT');
    return;
  }

  // ── AI: receiver chases, hitter recovers ──
  const recvName = (ball.hitter === 'A') ? 'B' : 'A';
  const otherName = ball.hitter;
  const R = tennisGame[recvName];
  const O = tennisGame[otherName];

  const intercept = predictIntercept(R.side);
  R.targetX = _clamp(intercept.x, -COURT.HALF_W * 1.05, COURT.HALF_W * 1.05);
  R.targetZ = R.side > 0
    ? _clamp(intercept.z,  0.6,  COURT.HALF_L + 0.6)
    : _clamp(intercept.z, -COURT.HALF_L - 0.6, -0.6);

  O.targetX = ball.pos.x * 0.25;       // shade slightly toward where ball is
  O.targetZ = O.side * 3.5;

  movePlayer(tennisGame.A, dt);
  movePlayer(tennisGame.B, dt);

  // ── Swing trigger: predict ball position SWING_LOOKAHEAD seconds ahead ──
  if (R.swingT0 < 0) {
    const fut = predictBall(SWING_LOOKAHEAD, ball.pos, ball.vel, ball.bounces);
    const racket = computeRacketPos(R);
    const dxz = Math.hypot(fut.p.x - racket.x, fut.p.z - racket.z);
    const yOK = fut.p.y > COURT.STRIKE_Y_MIN && fut.p.y < COURT.STRIKE_Y_MAX;
    // Ball should still be on receiver's side (or near it) at impact
    const onSide = (fut.p.z * R.side) > -0.3;
    if (dxz < COURT.RACKET_REACH && yOK && onSide) {
      triggerSwing(R, t, recvName);
    }
  }

  // Apply this frame's pose BEFORE resolveSwing so the racket's world matrix
  // reflects the current swing phase — otherwise getWorldPosition reads stale
  // rotations from the previous frame and the snap-to-racket lands slightly off.
  applyTennisPose(tennisGame.A, playerA, t);
  if (playerB) applyTennisPose(tennisGame.B, playerB, t);

  resolveSwing(tennisGame.A, t, 'A');
  resolveSwing(tennisGame.B, t, 'B');

  // ── Visual ball ──
  ballMesh.position.copy(ball.pos);
  ballMesh.rotateOnAxis(ball.spinAxis, ball.spinRate * dt);
  ballShadow.position.set(ball.pos.x, 0.01, ball.pos.z);
  const sh = _clamp(1 - ball.pos.y / 5, 0.25, 1);
  ballShadow.scale.setScalar(sh);
  ballShadow.material.opacity = 0.55 * sh;
}

// ─── POSE: READY (light bounce, racket up at right) ─────────
function poseTennisReady(P, parts, t) {
  const bounce = Math.sin(t * 5.5) * 0.5 + 0.5;
  const knee = 0.30 + bounce * 0.05;

  parts.rSh.rotation.set(-0.18, 0, 0.55);
  parts.rElb.rotation.set(-0.65, 0, 0);
  parts.lSh.rotation.set(-0.50, 0, 0.30);
  parts.lElb.rotation.set(-0.75, 0, 0);

  parts.rHip.rotation.set(-knee * 0.55, 0, 0);
  parts.lHip.rotation.set(-knee * 0.55, 0, 0);
  parts.rKn.rotation.x = knee;
  parts.lKn.rotation.x = knee;
  parts.rAnk.rotation.x = -knee * 0.4;
  parts.lAnk.rotation.x = -knee * 0.4;

  parts.spine.rotation.set(-0.06, 0, 0);
  parts.neckGrp.rotation.set(0.04, 0, 0);
}

// ─── POSE: RUN (legs/arms pump scaled by speed) ─────────────
function poseTennisRun(P, parts, t) {
  const ph = P.runPhase;
  const r = Math.sin(ph), l = -r;
  const amp = Math.min(1, P.speed / 3.4);

  parts.rHip.rotation.set(r * 0.55 * amp, 0, 0);
  parts.lHip.rotation.set(l * 0.55 * amp, 0, 0);
  parts.rKn.rotation.x = Math.max(0, -Math.cos(ph)) * 1.20 * amp;
  parts.lKn.rotation.x = Math.max(0,  Math.cos(ph)) * 1.20 * amp;

  // While chasing, racket arm stays slightly raised in ready position
  parts.rSh.rotation.set(-r * 0.22 * amp - 0.1, 0, 0.45);
  parts.lSh.rotation.set(-l * 0.30 * amp,        0, 0.18);
  parts.rElb.rotation.x = -0.85;
  parts.lElb.rotation.x = -0.55;

  parts.spine.rotation.set(-0.06, -r * 0.06 * amp, 0);
  parts.neckGrp.rotation.set(0.06, 0, 0);
  parts.rAnk.rotation.x = Math.max(0, r) * 0.20 * amp;
  parts.lAnk.rotation.x = Math.max(0, l) * 0.20 * amp;
}

// ─── POSE: SWING (state-driven, biomechanical kinetic chain) ─
const _SW_T1 = 0.10, _SW_T3 = SWING_CONTACT + 0.20, _SW_T4 = SWING_DURATION;
function poseTennisSwing(P, parts, t) {
  const lt = t - P.swingT0;
  let bodyY, sZ, sX, eX, lsZ, lsX, leX, knee, hipShift;

  if (lt < _SW_T1) {
    const k = lt / _SW_T1;
    bodyY = lerp(0.05, 0.20, k);
    sZ = lerp(0.55, 0.70, k);
    sX = lerp(-0.15, -0.20, k);
    eX = lerp(-0.65, -0.30, k);
    lsZ = 0.20; lsX = -0.50; leX = -0.55;
    knee = 0.32; hipShift = 0;
  } else if (lt < SWING_CONTACT) {
    // Backswing — body coils, racket up-back-right
    const k = ss((lt - _SW_T1) / (SWING_CONTACT - _SW_T1));
    bodyY = lerp(0.20, 0.62, k);
    sZ = lerp(0.70, 1.30, k);
    sX = lerp(-0.20, 0.55, k);
    eX = lerp(-0.30, 1.80, k);
    lsZ = lerp(0.20, 0.10, k);
    lsX = lerp(-0.50, -0.95, k);
    leX = lerp(-0.55, -0.10, k);
    knee = lerp(0.32, 0.44, k);
    hipShift = lerp(0, 0.06, k);
  } else if (lt < _SW_T3) {
    // Forward swing through impact (linear, fast)
    const k = (lt - SWING_CONTACT) / (_SW_T3 - SWING_CONTACT);
    bodyY = lerp(0.62, -0.28, k);
    sZ = lerp(1.30, 0.55, k);
    sX = lerp(0.55, -0.55, k);
    eX = lerp(1.80, -0.05, k);
    lsZ = lerp(0.10, 0.30, k);
    lsX = lerp(-0.95, -0.30, k);
    leX = lerp(-0.10, -0.85, k);
    knee = lerp(0.44, 0.20, k);
    hipShift = lerp(0.06, -0.05, k);
  } else {
    // Follow-through → recover
    const k = ss((lt - _SW_T3) / (_SW_T4 - _SW_T3));
    bodyY = lerp(-0.28, 0.05, k);
    sZ = lerp(0.55, 0.55, k);
    sX = lerp(-0.55, -0.18, k);
    eX = lerp(-0.05, -0.55, k);
    lsZ = 0.30; lsX = lerp(-0.30, -0.50, k); leX = lerp(-0.85, -0.55, k);
    knee = lerp(0.20, 0.30, k);
    hipShift = lerp(-0.05, 0, k);
  }

  parts.spine.rotation.set(-0.10, bodyY * 0.45, -bodyY * 0.06);
  parts.rSh.rotation.set(sX, 0, sZ);
  parts.rElb.rotation.set(eX, 0, 0);
  parts.lSh.rotation.set(lsX, 0, lsZ);
  parts.lElb.rotation.set(leX, 0, 0);
  parts.rHip.rotation.set(-knee * 0.55, 0, hipShift);
  parts.lHip.rotation.set(-knee * 0.55, 0, hipShift);
  parts.rKn.rotation.x = knee;
  parts.lKn.rotation.x = knee;
  parts.rAnk.rotation.x = -knee * 0.4;
  parts.lAnk.rotation.x = -knee * 0.4;
  parts.neckGrp.rotation.set(0.04, -bodyY * 0.5, 0);
  // Body coil contributes a small y-rotation on top of the player's facing
  parts.root.userData.swingBodyY = bodyY;
}

// ─── POSE: SERVE (toss → trophy → strike → follow-through) ──
// Joint convention (from animWave / poseTennisSwing):
//   • rSh.rotation.z = π/2 → arm horizontal out to right; = π → arm straight up.
//   • lSh.rotation.z = -π → arm overhead (rotates through left side).
//   • rElb.rotation.x positive bends the forearm "up-back" away from forward
//     (poseTennisSwing backswing uses eX=1.80 for "racket up-back-right");
//     negative bends forearm forward (idle eX=-0.65).
//   • lElb.rotation.x negative bends forearm forward across body.
//   • spine.rotation.z negative tilts the trunk toward the racket side (lateral
//     lean is the visual signature of the trophy → strike kinetic chain).
//
// Per Kovacs/Ellenbecker, contact has shoulder ≈ 100° abducted, elbow ≈ 20°
// (nearly straight), trunk fully extended overhead. Trophy has shoulder ≈ 90°,
// elbow ≈ 90° flex, racket pointing skyward.
function poseTennisServe(P, parts, t) {
  const lt = t - P.serveT0;
  const REL = SERVE_TOSS_RELEASE;
  const TROPHY_END = SERVE_TROPHY_END;
  const STRIKE = SERVE_STRIKE;
  const END = SERVE_END;
  let bodyY, bodyZ, sZ, sX, eX, lsZ, lsX, leX, knee, hipShift, headTilt;

  if (lt < REL) {
    // WINDUP: server coils away from net, both arms begin to lift in unison.
    // Toss arm rises along the body's left/front to deliver the ball overhead.
    const k = ss(lt / REL);
    bodyY = lerp(0, 0.45, k);          // shoulders coil away from net
    bodyZ = lerp(0, -0.12, k);         // trunk tilts toward racket side
    sZ = lerp(0.55, 1.30, k);          // upper arm rising to ~75° abducted
    sX = lerp(-0.18, -0.20, k);
    eX = lerp(-0.65, 0.40, k);         // forearm flips toward "up-back" sign
    lsZ = lerp(0.30, -2.20, k);        // toss arm rises past horizontal
    lsX = lerp(-0.50, 0.10, k);
    leX = lerp(-0.75, -0.20, k);
    knee = lerp(0.30, 0.45, k);
    hipShift = lerp(0, 0.04, k);
    headTilt = lerp(0.04, -0.22, k);   // eyes track the rising toss
  } else if (lt < TROPHY_END) {
    // TROPHY: shoulder ≈ 90-100° abducted, elbow ≈ 90° flex, racket points UP
    // behind/over the head; toss arm fully extended STRAIGHT UP at the ball.
    const k = ss((lt - REL) / (TROPHY_END - REL));
    bodyY = lerp(0.45, 0.55, k);       // peak shoulder coil
    bodyZ = lerp(-0.12, -0.22, k);     // peak lateral tilt back
    sZ = lerp(1.30, 1.75, k);          // ~100° abducted
    sX = lerp(-0.20, -0.30, k);
    eX = lerp(0.40, 1.85, k);          // ~90° flex with forearm pointing UP
    lsZ = lerp(-2.20, -3.05, k);       // ≈π → arm straight overhead
    lsX = lerp(0.10, 0.18, k);
    leX = lerp(-0.20, -0.05, k);       // toss arm fully extended
    knee = lerp(0.45, 0.62, k);        // deepest knee bend (loading)
    hipShift = lerp(0.04, 0.06, k);
    headTilt = -0.30;                  // looking straight up
  } else if (lt < STRIKE) {
    // STRIKE: legs explode upward, hips uncoil into shoulder-over-shoulder,
    // racket arm whips into full overhead extension to meet the falling ball.
    const k = (lt - TROPHY_END) / (STRIKE - TROPHY_END);
    bodyY = lerp(0.55, -0.15, k);      // uncoil through square
    bodyZ = lerp(-0.22, 0.05, k);      // lateral tilt reverses (lean forward)
    sZ = lerp(1.75, 3.05, k);          // arm whips overhead (≈π)
    sX = lerp(-0.30, 0.08, k);
    eX = lerp(1.85, -0.10, k);         // elbow snaps through to full extension
    lsZ = lerp(-3.05, -0.55, k);       // toss arm tucks across chest
    lsX = lerp(0.18, -0.40, k);
    leX = lerp(-0.05, -1.45, k);
    knee = lerp(0.62, 0.05, k);        // legs drive up at impact
    hipShift = lerp(0.06, -0.05, k);
    headTilt = lerp(-0.30, -0.10, k);
  } else {
    // FOLLOW: racket sweeps down across body to the opposite hip.
    const k = ss((lt - STRIKE) / (END - STRIKE));
    bodyY = lerp(-0.15, 0, k);
    bodyZ = lerp(0.05, 0, k);
    sZ = lerp(3.05, 0.40, k);          // arm sweeps down across the body
    sX = lerp(0.08, 0.65, k);
    eX = lerp(-0.10, -1.05, k);        // forearm flexes forward at finish
    lsZ = lerp(-0.55, 0.30, k);
    lsX = lerp(-0.40, -0.50, k);
    leX = lerp(-1.45, -0.75, k);
    knee = lerp(0.05, 0.30, k);
    hipShift = lerp(-0.05, 0, k);
    headTilt = lerp(-0.10, 0.04, k);
  }

  parts.spine.rotation.set(-0.10, bodyY * 0.45, bodyZ);
  parts.rSh.rotation.set(sX, 0, sZ);
  parts.rElb.rotation.set(eX, 0, 0);
  parts.lSh.rotation.set(lsX, 0, lsZ);
  parts.lElb.rotation.set(leX, 0, 0);
  parts.rHip.rotation.set(-knee * 0.55, 0, hipShift);
  parts.lHip.rotation.set(-knee * 0.55, 0, hipShift);
  parts.rKn.rotation.x = knee;
  parts.lKn.rotation.x = knee;
  parts.rAnk.rotation.x = -knee * 0.4;
  parts.lAnk.rotation.x = -knee * 0.4;
  parts.neckGrp.rotation.set(headTilt, -bodyY * 0.45, 0);
  parts.root.userData.swingBodyY = bodyY;
}

function applyTennisPose(P, parts, t) {
  parts.allGroups.forEach(g => g.rotation.set(0, 0, 0));
  parts.root.position.set(P.pos.x, parts.baseY, P.pos.z);
  parts.root.rotation.set(0, P.facing, 0);
  parts.root.userData.swingBodyY = 0;

  // Serve takes priority — its follow-through outlasts the strike frame, so
  // we keep the serve pose active until SERVE_END even after ball.serving=false.
  // But if a real swing has been triggered (rare quick return to the server),
  // bail out of the serve and let the swing pose run.
  if (P.serveT0 >= 0) {
    if (t - P.serveT0 > SERVE_END || P.swingT0 >= 0) {
      P.serveT0 = -1;
    } else {
      poseTennisServe(P, parts, t);
      parts.root.rotation.y = P.facing + (parts.root.userData.swingBodyY || 0);
      return;
    }
  }

  if (P.swingT0 >= 0) {
    poseTennisSwing(P, parts, t);
  } else if (P.speed > 0.6) {
    poseTennisRun(P, parts, t);
  } else {
    poseTennisReady(P, parts, t);
  }
  // Layer the swing body coil onto facing without disturbing world position
  parts.root.rotation.y = P.facing + (parts.root.userData.swingBodyY || 0);
}

// ─── SCORE HUD ──────────────────────────────────────────────
const scoreEl = document.getElementById('score');
// Real tennis: 0/15/30/40, then game point. After 40-40 it's deuce; the
// player ahead by 1 has the advantage (Ad). +2 closes the game.
function pointLabel(p, opp) {
  const ladder = ['0', '15', '30', '40'];
  // Deuce range only kicks in once both sides have reached 40 — before that
  // the receiver's "40" still reads as 40, not Deuce.
  if (p >= 3 && opp >= 3) {
    if (p === opp)     return 'Deuce';
    if (p === opp + 1) return 'Ad';
    return '—';
  }
  return ladder[Math.min(p, 3)];
}
function updateScoreHUD() {
  if (!scoreEl) return;
  const a = pointLabel(tennisGame.pointsA, tennisGame.pointsB);
  const b = pointLabel(tennisGame.pointsB, tennisGame.pointsA);
  const games = `${tennisGame.gamesA}-${tennisGame.gamesB}`;
  let tag;
  if (tennisGame.matchOver) {
    tag = `MATCH · ${tennisGame.matchWinner} WINS`;
  } else {
    tag = tennisGame.lastShotEnd
      ? tennisGame.lastShotEnd + ' · ' + tennisGame.lastShotName
      : tennisGame.lastShotName || 'RALLY';
  }
  scoreEl.innerHTML =
    `A ${a} — ${b} B<span class="shot">SET ${games} · ${tag}</span>`;
}
updateScoreHUD();

// ─── ENTER / EXIT TENNIS MODE ───────────────────────────────
function tennisEnter(t) {
  if (courtGroup) courtGroup.visible = true;
  // Reset positions and scores fresh each entry
  tennisGame.A.pos.set(0, 0,  3.7); tennisGame.A.facing = Math.PI;
  tennisGame.A.targetX = 0; tennisGame.A.targetZ = 3.7;
  tennisGame.A.speed = 0; tennisGame.A.swingT0 = -1;
  tennisGame.A.serveT0 = -1; tennisGame.A.serveStruck = false;
  tennisGame.B.pos.set(0, 0, -3.7); tennisGame.B.facing = 0;
  tennisGame.B.targetX = 0; tennisGame.B.targetZ = -3.7;
  tennisGame.B.speed = 0; tennisGame.B.swingT0 = -1;
  tennisGame.B.serveT0 = -1; tennisGame.B.serveStruck = false;
  tennisGame.pointsA = 0; tennisGame.pointsB = 0;
  tennisGame.gamesA  = 0; tennisGame.gamesB  = 0;
  tennisGame.matchOver = false;
  tennisGame.matchWinner = null;
  tennisGame.serveBy = 'A';
  tennisGame.rallyEndsAt = t + 0.7;
  tennisGame.lastShotName = '';
  tennisGame.lastShotEnd = '';
  ball.alive = false;
  ball.serving = false;
  ballMesh.visible = false;
  ballShadow.visible = false;
  updateScoreHUD();
}
function tennisExit() {
  if (courtGroup) courtGroup.visible = false;
  ballMesh.visible = false;
  ballShadow.visible = false;
  ball.alive = false;
  ball.serving = false;
  tennisGame.A.swingT0 = -1;
  tennisGame.B.swingT0 = -1;
  tennisGame.A.serveT0 = -1;
  tennisGame.B.serveT0 = -1;
}

// ── Main break dispatcher  [14s cycle] ──
// Each floor phase plants a specific contact joint (auto-picking the lowest
// would yank a swinging foot to the floor instead of the intended support).
function animBreak(t) {
  const CYCLE = 14;
  const cp = t % CYCLE;

  if (cp < 2.5) {
    breakToprock(t, cp);
    applyGroundCollision();           // feet on floor
  } else if (cp < 6.0) {
    breakWindmill(t, cp - 2.5);
    pinNodeToFloor(spine);            // upper back grazes floor
  } else if (cp < 9.5) {
    breakHeadspin(t, cp - 6.0);
    pinNodeToFloor(headPivot, 0.04, 0.27);  // crown of head on floor
  } else if (cp < 11.5) {
    breakFreeze(t, cp - 9.5);
    pinNodeToFloor(rHnd, 0.04, 0.06);       // planted right hand

  } else {
    breakGetUp(t, cp - 11.5);
    applyGroundCollision();           // feet on floor as we stand
  }
}

// ─── ARM PENETRATION — SPINE-LOCAL ELLIPSOID CHECK ──────────
// Transform forearm points into spine's LOCAL frame before checking.
// This handles body tilts (windmill, freeze) correctly.
// Torso shape in spine local: ellipse XZ (wider side than deep) × Y range.
const _spineInv = new THREE.Matrix4();
const _lv  = new THREE.Vector3(); // reusable local-space vector
const _h3  = new THREE.Vector3(); // hand world pos
const _e3  = new THREE.Vector3(); // elbow world pos
const _m3  = new THREE.Vector3(); // forearm midpoint world pos

// Ellipse semi-axes in spine local XZ; torso Y span.
// Tightened to match the slimmer 0.245/0.225 torso geometry, with a small
// margin so the clamp triggers BEFORE visible mesh penetration.
const E_RX = 0.255, E_RZ = 0.19;
const T_Y0 = -0.04, T_Y1 = 1.08;

function _inTorso(worldPt) {
  _lv.copy(worldPt).applyMatrix4(_spineInv);
  if (_lv.z > 0.12) return false; // reaching FORWARD of body is fine
  if (_lv.y < T_Y0 || _lv.y > T_Y1) return false;
  const ex = _lv.x / E_RX, ez = _lv.z / E_RZ;
  return ex*ex + ez*ez < 1.0;
}

function _fixArm(hnd, elbGrp, shGrp, outwardZ) {
  hnd.getWorldPosition(_h3);
  elbGrp.getWorldPosition(_e3);
  _m3.set((_h3.x+_e3.x)*.5, (_h3.y+_e3.y)*.5, (_h3.z+_e3.z)*.5);

  if (_inTorso(_h3) || _inTorso(_m3) || _inTorso(_e3)) {
    // First, try straightening the elbow (forearm flex is NEGATIVE in this
    // codebase's convention, so "straighten" means pull rotation.x toward 0).
    if (elbGrp.rotation.x < -0.05) {
      elbGrp.rotation.x = Math.min(0, elbGrp.rotation.x + 0.45);
      elbGrp.rotation.z *= 0.40;
    } else {
      // Elbow already straight → abduct the shoulder away from the torso
      shGrp.rotation.z += outwardZ * 0.22;
    }
    return true;
  }
  return false;
}

function clampArmsThroughBody() {
  for (let i = 0; i < 7; i++) {
    scene.updateMatrixWorld(true);
    _spineInv.copy(spine.matrixWorld).invert();
    // Outward sign FIXED: rSh.z POSITIVE = right arm abducts to its right;
    // lSh.z NEGATIVE = left arm abducts to its left. Previously these were
    // reversed and the clamp was pushing arms further INTO the torso.
    const rP = _fixArm(rHnd, rElb, rSh, +1); // right: outward = positive z
    const lP = _fixArm(lHnd, lElb, lSh, -1); // left:  outward = negative z
    if (!rP && !lP) break; // both clear → stop early
  }
}


// ─── GROUND COLLISION ───────────────────────────────────────
// After pose is set, measure world-space Y of all extremities.
// If anything goes underground, lift root up just enough.
const _wp = new THREE.Vector3();

function applyGroundCollision() {
  applyGroundCollisionFor({
    root, rFoot, lFoot, rHnd, lHnd, racket
  });
}

function applyGroundCollisionFor(P) {
  scene.updateMatrixWorld(true);
  let minY = Infinity;
  [P.rFoot, P.lFoot, P.rHnd, P.lHnd].forEach(obj => {
    obj.getWorldPosition(_wp);
    if (_wp.y < minY) minY = _wp.y;
  });
  if (mode === 'tennis' && P.racket && P.racket.userData.tip) {
    P.racket.userData.tip.getWorldPosition(_wp);
    if (_wp.y < minY) minY = _wp.y;
  }
  const FLOOR = 0.04;
  if (minY < FLOOR) {
    P.root.position.y += (FLOOR - minY);
  }
}

// Snap a contact node's lowest mesh point to the floor, then guarantee no
// other extremity punches through. `nodeRadius` lets a head/hand be pinned
// by its outer surface instead of its pivot — pinning headPivot with radius
// 0.27 during a headspin puts the *crown* of the head on the floor, not the
// pivot point that sits 0.27m above it. Each probe carries its own radius
// matching the visible mesh extent so we don't lift the body just because
// a pivot clears the floor while the actual mesh dips below.
function pinNodeToFloor(node, floor = 0.04, nodeRadius = 0) {
  scene.updateMatrixWorld(true);
  node.getWorldPosition(_wp);
  let rise = floor - (_wp.y - nodeRadius);
  const probes = [
    [spine, 0.10],   [rSh, 0.08],     [lSh, 0.08],
    [rElb, 0.06],    [lElb, 0.06],    [rHnd, 0.06],    [lHnd, 0.06],
    [rKn, 0.07],     [lKn, 0.07],     [rFoot, 0.05],   [lFoot, 0.05],
  ];
  if (headPivot) probes.push([headPivot, 0.27]);
  for (const [n, r] of probes) {
    n.getWorldPosition(_wp);
    if ((floor - (_wp.y - r)) > rise) rise = floor - (_wp.y - r);
  }
  root.position.y += rise;
}

// ─── TIME CONTROL ────────────────────────────────────────────
// `animClock` is the time fed to all animation functions. It advances with
// real time multiplied by `timeScale`, so SPACE (pause) and S (0.3x slow-mo)
// can freeze or stretch the animation without touching the dozens of
// frequency/phase constants baked into each anim*() function.
let animClock = 0;
let timeScale = 1;
let paused = false;
let _prevTs = -1;

function loop(ts) {
  requestAnimationFrame(loop);
  if (_prevTs < 0) _prevTs = ts;
  const realDt = (ts - _prevTs) * 0.001;
  _prevTs = ts;
  if (!paused) animClock += realDt * timeScale;
  const t = animClock;
  const dt = Math.min(0.05, Math.max(0.001, realDt * (paused ? 0 : timeScale)));

  // ─── TENNIS MODE: physics-driven rally for both players ───
  if (mode === 'tennis') {
    if (playerB) {
      playerB.root.visible = true;
      if (playerB.racket) playerB.racket.visible = true;
    }
    // tennisTick now applies pose internally before resolving contact
    tennisTick(t, dt);
    if (racket) racket.visible = true;
    applyGroundCollision();
    if (playerB) applyGroundCollisionFor(playerB);
  } else {
    // ─── SOLO MODES ──────────────────────────────────────────
    resetPose();
    switch (mode) {
      case 'idle':  animIdle(t);  break;
      case 'walk':  animWalk(t);  break;
      case 'wave':  animWave(t);  break;
      case 'dance': animDance(t); break;
      case 'run':   animRun(t);   break;
      case 'break': animBreak(t); break;
    }
    if (racket) racket.visible = false;
    // Arms-through-body check works in spine-local coordinates so it stays
    // correct for break-mode body tilts and inversions; we leave it on for
    // every solo mode so dramatic poses don't visually punch hands through
    // the torso.
    clampArmsThroughBody();
    // Break choreography places the floor-contact point itself (head, shoulder,
    // hand). Re-applying foot/hand ground collision on top would shove the
    // whole body upward and turn floor moves into a hover. So we skip it here
    // and instead pin the actual contact point to the floor inside animBreak.
    if (mode !== 'break') applyGroundCollision();
    if (playerB) {
      playerB.root.visible = false;
      if (playerB.racket) playerB.racket.visible = false;
    }
  }

  // Animated lights
  cyanLight.intensity = 1.3 + Math.sin(t*2.3)*0.2;

  // Camera
  const cx = camR * Math.sin(camTheta) * Math.cos(camPhi);
  const cy = camR * Math.sin(camPhi) + 2;
  const cz = camR * Math.cos(camTheta) * Math.cos(camPhi);
  camera.position.set(cx, cy, cz);
  if (mode === 'tennis') {
    // Frame both baselines and the net
    camera.lookAt(0, 1.4, 0);
  } else {
    camera.lookAt(0, 2.1, 0);
  }

  // Resize
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
}

loop(0);
</script>
