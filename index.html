<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Human</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#040911; }
  #c { display:block; width:100%; height:100%; }

  #controls {
    position:fixed; bottom:0; left:0; right:0; padding:14px 0 18px;
    display:flex; justify-content:center; gap:8px;
    background:linear-gradient(transparent, #040911ee);
    pointer-events:none;
  }
  .btn {
    padding:9px 22px; border:1px solid #00ffaa33;
    background:transparent; color:#00ffaa66;
    font-family:'Courier New',monospace; font-size:11px;
    letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; transition:.2s; pointer-events:all;
  }
  .btn:hover { border-color:#00ffaa88; color:#00ffaacc; background:#00ffaa0a; }
  .btn.active { border-color:#00ffaa; color:#00ffaa; background:#00ffaa18; }

  #label {
    position:fixed; top:16px; right:16px;
    font-family:'Courier New',monospace; font-size:10px;
    letter-spacing:3px; color:#00ffaa88;
  }
  #hint {
    position:fixed; top:16px; left:16px;
    font-family:'Courier New',monospace; font-size:10px;
    line-height:2.2; color:#00ffaa44;
  }

  /* Formula panel */
  #formulas {
    position:fixed; top:0; left:0; bottom:0;
    width:230px; padding:18px 14px 80px;
    overflow-y:auto; pointer-events:none;
    background:linear-gradient(to right, #040911ee 80%, transparent);
  }
  #formulas::-webkit-scrollbar { width:3px; }
  #formulas::-webkit-scrollbar-thumb { background:#00ffaa33; border-radius:2px; }

  .f-title {
    font-family:'Courier New',monospace; font-size:9px;
    letter-spacing:3px; color:#00ffaa; text-transform:uppercase;
    margin-bottom:14px; padding-bottom:6px;
    border-bottom:1px solid #00ffaa22;
  }
  .f-section {
    margin-bottom:14px;
  }
  .f-section-name {
    font-family:'Courier New',monospace; font-size:8px;
    letter-spacing:2px; color:#00ffaa88; text-transform:uppercase;
    margin-bottom:6px;
  }
  .f-row {
    display:flex; align-items:baseline; gap:6px;
    margin-bottom:5px; line-height:1.5;
  }
  .f-joint {
    font-family:'Courier New',monospace; font-size:8px;
    color:#00ffaa55; min-width:52px; flex-shrink:0;
  }
  .f-eq {
    font-family:'Courier New',monospace; font-size:9px;
    color:#00ffaacc; word-break:break-all;
  }
  .f-eq em {
    color:#ffcc00cc; font-style:normal;
  }
  .f-divider {
    height:1px; background:#00ffaa11; margin:10px 0;
  }
  .f-mode-block {
    margin-bottom:4px;
    border-left: 2px solid #00ffaa11;
    padding-left: 8px;
    transition: border-color .2s;
  }
  .f-mode-block.active {
    border-left-color: #00ffaa;
  }
  .f-mode-block.active .f-title {
    color: #00ffaa;
  }
  .f-mode-block:not(.active) .f-title {
    color: #00ffaa44;
  }
  .f-mode-block:not(.active) .f-section-name {
    color: #00ffaa33;
  }
  .f-mode-block:not(.active) .f-joint {
    color: #00ffaa22;
  }
  .f-mode-block:not(.active) .f-eq {
    color: #00ffaa44;
  }
  .f-mode-block:not(.active) .f-eq em {
    color: #ffcc0044;
  }
  .f-mode-sep {
    height:1px; background:#00ffaa18; margin:10px 0 12px;
  }

  /* Character selector */
  #char-bar {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    padding:6px 10px; border:1px solid #00ffaa33;
    background:#040911cc;
    font-family:'Courier New',monospace;
    z-index:5;
  }
  #char-bar .nav {
    width:24px; height:24px; padding:0;
    border:1px solid #00ffaa44; background:transparent;
    color:#00ffaa88; cursor:pointer;
    font-family:'Courier New',monospace; font-size:11px;
    transition:.15s;
  }
  #char-bar .nav:hover { border-color:#00ffaa; color:#00ffaa; background:#00ffaa15; }
  #char-select, #char-select-b {
    min-width:170px;
    background:transparent; color:#00ffaa;
    border:1px solid #00ffaa55;
    font-family:'Courier New',monospace; font-size:10px;
    letter-spacing:2px; text-transform:uppercase;
    padding:4px 8px; cursor:pointer; outline:none;
  }
  #char-select option, #char-select-b option { background:#040911; color:#00ffaa; }
  #char-index, #char-index-b {
    font-size:9px; letter-spacing:2px; color:#00ffaa66;
    min-width:46px; text-align:center;
  }
  .char-tag {
    font-size:9px; letter-spacing:2px; color:#00ffaa;
    border:1px solid #00ffaa55; padding:2px 6px;
  }
  .char-sep { color:#00ffaa33; font-size:14px; margin:0 4px; }
  .b-only { display:none; }
  body.tennis-mode .b-only { display:inline-block; }
  body.tennis-mode #char-bar { gap:6px; }

  /* Tennis HUD */
  #score {
    position:fixed; top:60px; left:50%; transform:translateX(-50%);
    display:none;
    font-family:'Courier New',monospace; font-size:13px; letter-spacing:5px;
    color:#00ffaa; background:#040911cc;
    border:1px solid #00ffaa44; padding:6px 18px;
    z-index:5;
  }
  body.tennis-mode #score { display:block; }
  #score .shot {
    display:block; font-size:9px; letter-spacing:3px;
    color:#ffcc44aa; margin-top:4px;
  }

  /* Scanline overlay */
  #overlay {
    position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      #00000018 2px,
      #00000018 4px
    );
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<div id="controls">
  <button class="btn active" data-anim="idle">IDLE</button>
  <button class="btn" data-anim="walk">WALK</button>
  <button class="btn" data-anim="wave">WAVE</button>
  <button class="btn" data-anim="dance">DANCE</button>
  <button class="btn" data-anim="run">RUN</button>
  <button class="btn" data-anim="break">BREAK</button>
  <button class="btn" data-anim="tennis">TENNIS</button>
</div>
<div id="char-bar">
  <span class="char-tag">A</span>
  <button class="nav" id="char-prev">◀</button>
  <select id="char-select"></select>
  <button class="nav" id="char-next">▶</button>
  <span id="char-index">01/50</span>
  <span class="char-sep b-only">|</span>
  <span class="char-tag b-only">B</span>
  <button class="nav b-only" id="char-prev-b">◀</button>
  <select id="char-select-b" class="b-only"></select>
  <button class="nav b-only" id="char-next-b">▶</button>
  <span id="char-index-b" class="b-only">02/50</span>
</div>
<div id="label">MODE: IDLE</div>
<div id="hint" style="top:auto;bottom:70px;font-size:9px;">DRAG旋轉 · SCROLL縮放 · 1-7模式 · SPACE暫停 · S慢動作 · ←→換角色</div>
<div id="formulas"></div>
<div id="score">A 0 — 0 B<span class="shot">RALLY</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── RENDERER ───────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040911);
scene.fog = new THREE.FogExp2(0x040911, 0.055);

const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 60);

// ─── LIGHTS ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x182840, 2.5));

const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 30;
scene.add(sun);

const cyanLight = new THREE.PointLight(0x00ffcc, 1.5, 14);
cyanLight.position.set(-4, 5, -2);
scene.add(cyanLight);

const blueLight = new THREE.PointLight(0x0044ff, 0.8, 10);
blueLight.position.set(5, 1, 4);
scene.add(blueLight);

// ─── FLOOR ──────────────────────────────────────────────────
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshPhongMaterial({ color: 0x060d1a, shininess: 15 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);
scene.add(new THREE.GridHelper(18, 36, 0x0a2030, 0x060e18));

// ─── MATERIAL HELPERS ───────────────────────────────────────
const mkMat = (c, s=60, e=0) => new THREE.MeshPhongMaterial({ color:c, shininess:s, emissive:e });

// ─── GEOMETRY HELPERS ───────────────────────────────────────
const mkSphere = (r, mat) =>
  new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat.clone());

const mkCyl = (r1, r2, h, mat) =>
  new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, 10), mat.clone());

const mkBox = (w, h, d, mat) =>
  new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat.clone());

// Limb group — pivot at origin (top), limb hangs downward
function mkLimb(len, rad, mat, jointMat) {
  const g = new THREE.Group();
  const cyl = mkCyl(rad * 0.82, rad, len, mat);
  cyl.position.y = -len / 2;
  cyl.castShadow = true;
  g.add(cyl);
  const j = mkSphere(rad * 1.12, jointMat);
  j.position.y = -len;
  g.add(j);
  return g;
}

// ─── HAIR STYLES ────────────────────────────────────────────
// Y-positions are HEAD-CENTER-RELATIVE (the parent group is headPivot),
// so a hair piece sitting on top of a head of radius 0.34 sits at y≈0.16.
function buildHair(style, color, headPivot) {
  if (style === 'bald') return;
  const mat = mkMat(color, 30);
  switch (style) {
    case 'short': {
      const h = mkSphere(0.31, mat);
      h.position.y = 0.16; h.scale.set(1.05, 0.58, 1.05); headPivot.add(h);
      break;
    }
    case 'long': {
      const top = mkSphere(0.32, mat);
      top.position.y = 0.14; top.scale.set(1.05, 0.7, 1.05); headPivot.add(top);
      const back = mkBox(0.5, 0.55, 0.16, mat);
      back.position.set(0, -0.32, -0.2); headPivot.add(back);
      break;
    }
    case 'ponytail': {
      const top = mkSphere(0.31, mat);
      top.position.y = 0.16; top.scale.set(1.05, 0.55, 1.05); headPivot.add(top);
      const tail = mkCyl(0.07, 0.04, 0.42, mat);
      tail.position.set(0, -0.07, -0.28);
      tail.rotation.x = 0.25;
      headPivot.add(tail);
      break;
    }
    case 'mohawk': {
      const base = mkSphere(0.31, mat);
      base.position.y = 0.14; base.scale.set(1.05, 0.3, 1.05); headPivot.add(base);
      const fin = mkBox(0.06, 0.26, 0.42, mat);
      fin.position.y = 0.40; headPivot.add(fin);
      break;
    }
    case 'bun': {
      const base = mkSphere(0.31, mat);
      base.position.y = 0.14; base.scale.set(1.05, 0.55, 1.05); headPivot.add(base);
      const bun = mkSphere(0.14, mat);
      bun.position.set(0, 0.44, 0); headPivot.add(bun);
      break;
    }
    case 'afro': {
      const a = mkSphere(0.45, mat);
      a.position.y = 0.22; headPivot.add(a);
      break;
    }
    case 'cap': {
      const cap = mkSphere(0.34, mat);
      cap.position.y = 0.20; cap.scale.set(1.0, 0.55, 1.0); headPivot.add(cap);
      const brim = mkBox(0.4, 0.04, 0.18, mat);
      brim.position.set(0, 0.10, 0.22); headPivot.add(brim);
      break;
    }
    case 'spike': {
      const base = mkSphere(0.30, mat);
      base.position.y = 0.14; base.scale.set(1.05, 0.5, 1.05); headPivot.add(base);
      for (let i = -2; i <= 2; i++) {
        const sp = mkCyl(0.04, 0.005, 0.2, mat);
        sp.position.set(i * 0.085, 0.42, 0.0);
        sp.rotation.z = i * 0.1;
        headPivot.add(sp);
      }
      break;
    }
    case 'bob': {
      const base = mkSphere(0.33, mat);
      base.position.y = 0.14; base.scale.set(1.1, 0.65, 1.1); headPivot.add(base);
      const fringe = mkBox(0.55, 0.18, 0.08, mat);
      fringe.position.set(0, -0.02, 0.27); headPivot.add(fringe);
      break;
    }
    case 'buzz': {
      const h = mkSphere(0.29, mat);
      h.position.y = 0.14; h.scale.set(1.0, 0.4, 1.0); headPivot.add(h);
      break;
    }
  }
}

// ─── BUILD FIGURE ───────────────────────────────────────────
let BASE_Y = 1.53;

function buildCharacter(cfg) {
  const skinColor   = cfg.skin;
  const clothBlue   = cfg.shirt;
  const clothDark   = cfg.pants;
  const eyeColor    = cfg.eye;
  const hairColor   = cfg.hair;
  const panelColor  = cfg.panel;
  const jointColor  = cfg.joint || 0x00ffcc;

  const jointMat = mkMat(jointColor, 150, jointColor & 0x333333);
  const eyeMat   = mkMat(eyeColor, 200, eyeColor & 0x222222);

  const root = new THREE.Group();
  root.position.y = BASE_Y;
  if (cfg.scale && cfg.scale !== 1) root.scale.setScalar(cfg.scale);

  // Pelvis (slightly larger to match wider hips)
  root.add(mkSphere(0.22, mkMat(clothBlue, 70)));

  // Spine / upper body
  const spine = new THREE.Group();
  root.add(spine);

  // Torso slimmed slightly so arms don't crowd it (was 0.265/0.235)
  const torsoMesh = mkCyl(0.245, 0.225, 1.0, mkMat(clothBlue, 70));
  torsoMesh.position.y = 0.5;
  torsoMesh.castShadow = true;
  spine.add(torsoMesh);

  // Tech chest panel
  const panel = mkBox(0.4, 0.32, 0.07, mkMat(0x001833, 200, 0x000d22));
  panel.position.set(0, 0.62, 0.245);
  spine.add(panel);

  const glowBar = mkBox(0.35, 0.018, 0.01, mkMat(panelColor, 300, panelColor));
  glowBar.position.set(0, 0.65, 0.278);
  spine.add(glowBar);

  // Shoulder collar bar (matches widened SX=0.50)
  const collarBar = mkCyl(0.052, 0.052, 0.96, mkMat(clothBlue, 70));
  collarBar.rotation.z = Math.PI / 2;
  collarBar.position.y = 0.97;
  spine.add(collarBar);

  // Neck group
  const neckGrp = new THREE.Group();
  neckGrp.position.y = 1.0;
  spine.add(neckGrp);

  const neckCyl = mkCyl(0.095, 0.115, 0.19, mkMat(skinColor, 50));
  neckCyl.position.y = 0.095;
  neckGrp.add(neckCyl);

  // ─── HEAD PIVOT (scaled for ~7-head proportions) ──────────
  // Wrapping head + features in a sub-group lets us scale the entire head
  // assembly uniformly without re-tuning every face feature position.
  // Scale 0.79 brings head sphere from r=0.34 to effective r=0.27, taking
  // the body from ~5 head heights to ~6.5 (closer to adult human ratio).
  const HEAD_S = 0.79;
  const headPivot = new THREE.Group();
  headPivot.position.y = 0.46;          // head bottom touches neck top (0.19)
  headPivot.scale.setScalar(HEAD_S);
  neckGrp.add(headPivot);

  // Head sphere centered at pivot origin
  const headMesh = mkSphere(0.34, mkMat(skinColor, 50));
  headMesh.castShadow = true;
  headPivot.add(headMesh);

  // Eyes — coords now head-relative (subtract old 0.52 offset)
  [-0.115, 0.115].forEach(x => {
    const e = mkSphere(0.052, eyeMat);
    e.position.set(x, 0.04, 0.305);
    headPivot.add(e);
    const p = mkSphere(0.028, mkMat(0x000022, 300, 0x0011aa));
    p.position.set(x, 0.04, 0.333);
    headPivot.add(p);
  });

  buildHair(cfg.hairStyle, hairColor, headPivot);

  // Eyebrows
  [-0.115, 0.115].forEach(x => {
    const br = mkBox(0.085, 0.018, 0.015, mkMat(hairColor, 20));
    br.position.set(x, 0.11, 0.338);
    br.rotation.z = x > 0 ? 0.18 : -0.18;
    headPivot.add(br);
  });

  if (cfg.accessory === 'visor') {
    const visor = mkBox(0.42, 0.08, 0.04, mkMat(panelColor, 300, panelColor));
    visor.position.set(0, 0.04, 0.34);
    headPivot.add(visor);
  } else if (cfg.accessory === 'beard') {
    const beard = mkBox(0.22, 0.13, 0.06, mkMat(hairColor, 20));
    beard.position.set(0, -0.10, 0.30);
    headPivot.add(beard);
  }

  // ─── ARMS ─────────────────────────────────────────────────
  // SX = 0.50 (≈ 1/4 body height per Vitruvian); leaves >12cm gap from
  // torso outer (0.245) for the forearm cylinder (radius 0.082) to swing
  // without ever penetrating the chest.
  const SY = 0.92, SX = 0.50;
  const armMat = mkMat(skinColor, 50);

  // Limb lengths chosen so total height ≈ 6.5 head heights (head r=0.27 effective).
  // Upper arm 0.66 + forearm 0.55 ≈ 0.32 of body height — matches anatomical ratio.
  const UA_LEN = 0.66, FA_LEN = 0.55;

  const rSh = new THREE.Group(); rSh.position.set(SX, SY, 0); spine.add(rSh);
  const rUA = mkLimb(UA_LEN, 0.098, armMat, jointMat); rSh.add(rUA);
  const rElb = new THREE.Group(); rElb.position.y = -UA_LEN; rUA.add(rElb);
  const rLA = mkLimb(FA_LEN, 0.082, armMat, jointMat); rElb.add(rLA);
  const rHnd = mkSphere(0.09, mkMat(skinColor, 50)); rHnd.position.y = -FA_LEN; rElb.add(rHnd);

  const lSh = new THREE.Group(); lSh.position.set(-SX, SY, 0); spine.add(lSh);
  const lUA = mkLimb(UA_LEN, 0.098, armMat, jointMat); lSh.add(lUA);
  const lElb = new THREE.Group(); lElb.position.y = -UA_LEN; lUA.add(lElb);
  const lLA = mkLimb(FA_LEN, 0.082, armMat, jointMat); lElb.add(lLA);
  const lHnd = mkSphere(0.09, mkMat(skinColor, 50)); lHnd.position.y = -FA_LEN; lElb.add(lHnd);

  // ─── TENNIS RACKET (hidden until tennis mode) ─────────────
  const racket = buildRacket();
  racket.visible = false;
  rHnd.add(racket);

  // ─── LEGS ─────────────────────────────────────────────────
  // HX = 0.28 (≈ 1/5 body height per anthropometric data); inner edges
  // of the thighs (radius 0.125) sit ~0.16 apart so the legs are clearly
  // separate at any pose.
  const HX = 0.28;
  const legClothMat = mkMat(clothDark, 70);

  // Leg lengths chosen so the leg ≈ 50% of body height (Vitruvian).
  const UL_LEN = 0.85, LL_LEN = 0.80;

  const rHip = new THREE.Group(); rHip.position.set(HX, 0, 0); root.add(rHip);
  const rUL = mkLimb(UL_LEN, 0.125, legClothMat, jointMat); rHip.add(rUL);
  const rKn = new THREE.Group(); rKn.position.y = -UL_LEN; rUL.add(rKn);
  const rLL = mkLimb(LL_LEN, 0.1, legClothMat, jointMat); rKn.add(rLL);
  const rAnk = new THREE.Group(); rAnk.position.y = -LL_LEN; rLL.add(rAnk);
  const rFoot = mkBox(0.15, 0.1, 0.3, mkMat(clothDark, 40)); rFoot.position.set(0, -0.05, 0.08); rAnk.add(rFoot);

  const lHip = new THREE.Group(); lHip.position.set(-HX, 0, 0); root.add(lHip);
  const lUL = mkLimb(UL_LEN, 0.125, legClothMat, jointMat); lHip.add(lUL);
  const lKn = new THREE.Group(); lKn.position.y = -UL_LEN; lUL.add(lKn);
  const lLL = mkLimb(LL_LEN, 0.1, legClothMat, jointMat); lKn.add(lLL);
  const lAnk = new THREE.Group(); lAnk.position.y = -LL_LEN; lLL.add(lAnk);
  const lFoot = mkBox(0.15, 0.1, 0.3, mkMat(clothDark, 40)); lFoot.position.set(0, -0.05, 0.08); lAnk.add(lFoot);

  return { root, spine, neckGrp, headPivot, rSh, lSh, rElb, lElb, rHnd, lHnd,
           rHip, lHip, rKn, lKn, rAnk, lAnk, rFoot, lFoot, racket };
}

// ─── TENNIS RACKET BUILDER ──────────────────────────────────
function buildRacket() {
  const g = new THREE.Group();
  const frameMat  = mkMat(0x222226, 100);
  const gripMat   = mkMat(0x101010, 60);
  const stringMat = mkMat(0xeeeeee, 50);
  const accentMat = mkMat(0x00ffaa, 200, 0x004433);

  // Grip (black wrap)
  const grip = mkCyl(0.034, 0.034, 0.22, gripMat);
  grip.position.y = -0.15;
  g.add(grip);

  // Shaft accent ring
  const accent = mkCyl(0.038, 0.038, 0.025, accentMat);
  accent.position.y = -0.27;
  g.add(accent);

  // Throat — V shape (two thin struts)
  const t1 = mkCyl(0.016, 0.016, 0.16, frameMat);
  t1.position.set(0.072, -0.38, 0);
  t1.rotation.z = -0.42;
  g.add(t1);
  const t2 = mkCyl(0.016, 0.016, 0.16, frameMat);
  t2.position.set(-0.072, -0.38, 0);
  t2.rotation.z = 0.42;
  g.add(t2);

  // Head — oval frame (torus, axis along z so face points forward/back)
  const frame = new THREE.Mesh(
    new THREE.TorusGeometry(0.18, 0.024, 8, 32),
    frameMat.clone()
  );
  frame.position.y = -0.62;
  frame.scale.set(1, 1.18, 1);
  g.add(frame);

  // Strings (translucent disc)
  const strings = new THREE.Mesh(
    new THREE.CircleGeometry(0.17, 24),
    stringMat.clone()
  );
  strings.material.side = THREE.DoubleSide;
  strings.material.transparent = true;
  strings.material.opacity = 0.55;
  strings.position.y = -0.62;
  strings.scale.set(1, 1.18, 1);
  g.add(strings);

  // Tip marker (used for floor collision in tennis mode)
  const tip = new THREE.Object3D();
  tip.position.y = -0.83;
  g.add(tip);
  g.userData.tip = tip;

  // Sweet-spot marker — center of the strings, used for ball-contact snap
  const sweet = new THREE.Object3D();
  sweet.position.y = -0.62;
  g.add(sweet);
  g.userData.sweet = sweet;

  return g;
}

// ─── Mutable references — globals point to PLAYER A's parts.
// Player B has its own parts stored in `playerB`. Most animations
// operate on globals (= A); tennis animates both A and B.
let root, spine, neckGrp, headPivot, rSh, lSh, rElb, lElb, rHnd, lHnd,
    rHip, lHip, rKn, lKn, rAnk, lAnk, rFoot, lFoot, racket;
let ALL_GROUPS = [];
let playerA = null, playerB = null;
let baseYA = 1.53, baseYB = 1.53;

function disposeCharacter(r) {
  r.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

function _partsToList(p) {
  return [p.rSh, p.lSh, p.rElb, p.lElb, p.rHip, p.lHip, p.rKn, p.lKn,
          p.rAnk, p.lAnk, p.spine, p.neckGrp, p.root];
}

function setCharacter(idx) {
  const cfg = CHARACTERS[idx];
  baseYA = 0.04 + 1.75 * (cfg.scale || 1.0);
  BASE_Y = baseYA;
  if (root) {
    scene.remove(root);
    disposeCharacter(root);
  }
  const parts = buildCharacter(cfg);
  ({ root, spine, neckGrp, headPivot, rSh, lSh, rElb, lElb, rHnd, lHnd,
     rHip, lHip, rKn, lKn, rAnk, lAnk, rFoot, lFoot, racket } = parts);
  scene.add(root);
  ALL_GROUPS = _partsToList(parts);
  parts.baseY = baseYA;
  parts.allGroups = ALL_GROUPS;
  playerA = parts;
}

function setCharacterB(idx) {
  const cfg = CHARACTERS[idx];
  baseYB = 0.04 + 1.75 * (cfg.scale || 1.0);
  if (playerB && playerB.root) {
    scene.remove(playerB.root);
    disposeCharacter(playerB.root);
  }
  const parts = buildCharacter(cfg);
  parts.baseY = baseYB;
  parts.allGroups = _partsToList(parts);
  // Position B on opposite court, facing player A
  parts.root.position.set(0, baseYB, -3.0);
  parts.root.rotation.y = Math.PI;
  parts.root.visible = (mode === 'tennis');
  scene.add(parts.root);
  playerB = parts;
}

let camR = 7, camTheta = 0.2, camPhi = 0.32;
let isDrag = false, pm = {x:0,y:0};

canvas.addEventListener('mousedown', e => { isDrag=true; pm={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('touchstart', e => { isDrag=true; pm={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
window.addEventListener('mouseup', () => isDrag=false);
window.addEventListener('touchend', () => isDrag=false);
function onDrag(x,y) {
  if(!isDrag) return;
  camTheta -= (x-pm.x)*0.013;
  camPhi = Math.max(0.06, Math.min(1.25, camPhi+(y-pm.y)*0.011));
  pm={x,y};
}
window.addEventListener('mousemove', e => onDrag(e.clientX,e.clientY));
window.addEventListener('touchmove', e => onDrag(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
canvas.addEventListener('wheel', e => {
  camR = Math.max(3, Math.min(14, camR+e.deltaY*0.009));
},{passive:true});

function renderFormulas(activeKey) {
  let html = '';
  FORMULAS.forEach(fm => {
    const isActive = fm.key === activeKey;
    html += `<div class="f-mode-block ${isActive ? 'active' : ''}">`;
    html += `<div class="f-title">${fm.title}</div>`;
    fm.sections.forEach(sec => {
      html += `<div class="f-section">`;
      if (sec.name) html += `<div class="f-section-name">${sec.name}</div>`;
      sec.rows.forEach(([joint, eq]) => {
        html += `<div class="f-row"><span class="f-joint">${joint}</span><span class="f-eq">${eq}</span></div>`;
      });
      html += `</div>`;
    });
    html += `</div><div class="f-mode-sep"></div>`;
  });
  formulaEl.innerHTML = html;
  // Scroll active block into view
  const activeEl = formulaEl.querySelector('.f-mode-block.active');
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function refreshModeLabel() {
  const tag =
    paused                ? ' · PAUSED'
    : (timeScale !== 1)   ? ' · SLOW '+timeScale.toFixed(2)+'x'
    :                       '';
  labelEl.textContent = 'MODE: '+mode.toUpperCase() + tag;
}

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const prevMode = mode;
    mode = btn.dataset.anim;
    refreshModeLabel();
    document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderFormulas(mode);
    document.body.classList.toggle('tennis-mode', mode === 'tennis');
    if (mode === 'tennis' && !playerB) pickCharacterB(currentCharB);
    // Pull camera back when first entering tennis so both players fit
    if (mode === 'tennis' && prevMode !== 'tennis') {
      camR = Math.max(camR, 11);
      camPhi = 0.46;
      camTheta = 0.20;
      tennisEnter(animClock);
    } else if (mode !== 'tennis' && prevMode === 'tennis') {
      camR = 7;
      camPhi = 0.32;
      tennisExit();
    }
  });
});

// Number keys 1–7 → switch animation mode by clicking the corresponding
// button (so all the side-effects in the click handler — HUD, formula
// panel, tennis enter/exit, camera framing — fire correctly).
const _MODE_KEY_ORDER = ['idle','walk','wave','dance','run','break','tennis'];
window.addEventListener('keydown', e => {
  // Don't hijack typing in form fields
  const tag = (e.target && e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  if (e.key === 'ArrowLeft')  { pickCharacter(currentChar - 1); return; }
  if (e.key === 'ArrowRight') { pickCharacter(currentChar + 1); return; }

  // Mode hotkeys
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= _MODE_KEY_ORDER.length) {
    const wantMode = _MODE_KEY_ORDER[n - 1];
    const btn = document.querySelector(`[data-anim="${wantMode}"]`);
    if (btn) btn.click();
    return;
  }

  // Time controls
  if (e.code === 'Space') {
    paused = !paused;
    refreshModeLabel();
    e.preventDefault();
    return;
  }
  if (e.key === 's' || e.key === 'S') {
    timeScale = (timeScale === 1) ? 0.30 : 1;
    refreshModeLabel();
    return;
  }
});
