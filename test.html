<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Human</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#040911; }
  #c { display:block; width:100%; height:100%; }

  #controls {
    position:fixed; bottom:0; left:0; right:0; padding:14px 0 18px;
    display:flex; justify-content:center; gap:8px;
    background:linear-gradient(transparent, #040911ee);
    pointer-events:none;
  }
  .btn {
    padding:9px 22px; border:1px solid #00ffaa33;
    background:transparent; color:#00ffaa66;
    font-family:'Courier New',monospace; font-size:11px;
    letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; transition:.2s; pointer-events:all;
  }
  .btn:hover { border-color:#00ffaa88; color:#00ffaacc; background:#00ffaa0a; }
  .btn.active { border-color:#00ffaa; color:#00ffaa; background:#00ffaa18; }

  #label {
    position:fixed; top:16px; right:16px;
    font-family:'Courier New',monospace; font-size:10px;
    letter-spacing:3px; color:#00ffaa88;
  }
  #hint {
    position:fixed; top:16px; left:16px;
    font-family:'Courier New',monospace; font-size:10px;
    line-height:2.2; color:#00ffaa44;
  }

  /* Formula panel */
  #formulas {
    position:fixed; top:0; left:0; bottom:0;
    width:230px; padding:18px 14px 80px;
    overflow-y:auto; pointer-events:none;
    background:linear-gradient(to right, #040911ee 80%, transparent);
  }
  #formulas::-webkit-scrollbar { width:3px; }
  #formulas::-webkit-scrollbar-thumb { background:#00ffaa33; border-radius:2px; }

  .f-title {
    font-family:'Courier New',monospace; font-size:9px;
    letter-spacing:3px; color:#00ffaa; text-transform:uppercase;
    margin-bottom:14px; padding-bottom:6px;
    border-bottom:1px solid #00ffaa22;
  }
  .f-section {
    margin-bottom:14px;
  }
  .f-section-name {
    font-family:'Courier New',monospace; font-size:8px;
    letter-spacing:2px; color:#00ffaa88; text-transform:uppercase;
    margin-bottom:6px;
  }
  .f-row {
    display:flex; align-items:baseline; gap:6px;
    margin-bottom:5px; line-height:1.5;
  }
  .f-joint {
    font-family:'Courier New',monospace; font-size:8px;
    color:#00ffaa55; min-width:52px; flex-shrink:0;
  }
  .f-eq {
    font-family:'Courier New',monospace; font-size:9px;
    color:#00ffaacc; word-break:break-all;
  }
  .f-eq em {
    color:#ffcc00cc; font-style:normal;
  }
  .f-divider {
    height:1px; background:#00ffaa11; margin:10px 0;
  }
  .f-mode-block {
    margin-bottom:4px;
    border-left: 2px solid #00ffaa11;
    padding-left: 8px;
    transition: border-color .2s;
  }
  .f-mode-block.active {
    border-left-color: #00ffaa;
  }
  .f-mode-block.active .f-title {
    color: #00ffaa;
  }
  .f-mode-block:not(.active) .f-title {
    color: #00ffaa44;
  }
  .f-mode-block:not(.active) .f-section-name {
    color: #00ffaa33;
  }
  .f-mode-block:not(.active) .f-joint {
    color: #00ffaa22;
  }
  .f-mode-block:not(.active) .f-eq {
    color: #00ffaa44;
  }
  .f-mode-block:not(.active) .f-eq em {
    color: #ffcc0044;
  }
  .f-mode-sep {
    height:1px; background:#00ffaa18; margin:10px 0 12px;
  }

  /* Scanline overlay */
  #overlay {
    position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      #00000018 2px,
      #00000018 4px
    );
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<div id="controls">
  <button class="btn active" data-anim="idle">IDLE</button>
  <button class="btn" data-anim="walk">WALK</button>
  <button class="btn" data-anim="wave">WAVE</button>
  <button class="btn" data-anim="dance">DANCE</button>
  <button class="btn" data-anim="run">RUN</button>
  <button class="btn" data-anim="break">BREAK</button>
  <button class="btn" data-anim="sixseven">SIX SEVEN</button>
</div>
<div id="label">MODE: IDLE</div>
<div id="hint" style="top:auto;bottom:70px;font-size:9px;">DRAG旋轉 · SCROLL縮放</div>
<div id="formulas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── RENDERER ───────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040911);
scene.fog = new THREE.FogExp2(0x040911, 0.055);

const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 60);

// ─── LIGHTS ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x182840, 2.5));

const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 30;
scene.add(sun);

const cyanLight = new THREE.PointLight(0x00ffcc, 1.5, 14);
cyanLight.position.set(-4, 5, -2);
scene.add(cyanLight);

const blueLight = new THREE.PointLight(0x0044ff, 0.8, 10);
blueLight.position.set(5, 1, 4);
scene.add(blueLight);

// ─── FLOOR ──────────────────────────────────────────────────
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshPhongMaterial({ color: 0x060d1a, shininess: 15 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);
scene.add(new THREE.GridHelper(18, 36, 0x0a2030, 0x060e18));

// ─── MATERIALS ──────────────────────────────────────────────
const skinColor = 0xd0946a;
const clothBlue = 0x1e4882;
const clothDark = 0x0d1828;

const mkMat = (c, s=60, e=0) => new THREE.MeshPhongMaterial({ color:c, shininess:s, emissive:e });
const jointMat = mkMat(0x00ffcc, 150, 0x003322);
const eyeMat   = mkMat(0x00ccff, 200, 0x001a33);

// ─── GEOMETRY HELPERS ───────────────────────────────────────
const mkSphere = (r, mat) =>
  new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat.clone());

const mkCyl = (r1, r2, h, mat) =>
  new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, 10), mat.clone());

const mkBox = (w, h, d, mat) =>
  new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat.clone());

// Limb group — pivot at origin (top), limb hangs downward
function mkLimb(len, rad, mat) {
  const g = new THREE.Group();
  const cyl = mkCyl(rad * 0.82, rad, len, mat);
  cyl.position.y = -len / 2;
  cyl.castShadow = true;
  g.add(cyl);
  const j = mkSphere(rad * 1.12, jointMat);
  j.position.y = -len;
  g.add(j);
  return g;
}

// ─── BUILD FIGURE ───────────────────────────────────────────
const BASE_Y = 1.53;
const root = new THREE.Group();
root.position.y = BASE_Y;
scene.add(root);

// Pelvis
root.add(mkSphere(0.2, mkMat(clothBlue, 70)));

// Spine / upper body
const spine = new THREE.Group();
root.add(spine);

const torsoMesh = mkCyl(0.265, 0.235, 1.0, mkMat(clothBlue, 70));
torsoMesh.position.y = 0.5;
torsoMesh.castShadow = true;
spine.add(torsoMesh);

// Tech chest panel
const panel = mkBox(0.4, 0.32, 0.07, mkMat(0x001833, 200, 0x000d22));
panel.position.set(0, 0.62, 0.245);
spine.add(panel);

const glowBar = mkBox(0.35, 0.018, 0.01, mkMat(0x00ffcc, 300, 0x00ffcc));
glowBar.position.set(0, 0.65, 0.278);
spine.add(glowBar);

// Shoulder collar bar
const collarBar = mkCyl(0.052, 0.052, 0.85, mkMat(clothBlue, 70));
collarBar.rotation.z = Math.PI / 2;
collarBar.position.y = 0.97;
spine.add(collarBar);

// Neck group
const neckGrp = new THREE.Group();
neckGrp.position.y = 1.0;
spine.add(neckGrp);

const neckCyl = mkCyl(0.095, 0.115, 0.19, mkMat(skinColor, 50));
neckCyl.position.y = 0.095;
neckGrp.add(neckCyl);

// Head
const headMesh = mkSphere(0.34, mkMat(skinColor, 50));
headMesh.position.y = 0.52;
headMesh.castShadow = true;
neckGrp.add(headMesh);

// Eyes
[-0.115, 0.115].forEach(x => {
  const e = mkSphere(0.052, eyeMat);
  e.position.set(x, 0.56, 0.305);
  neckGrp.add(e);
  // Pupil
  const p = mkSphere(0.028, mkMat(0x000022, 300, 0x0011aa));
  p.position.set(x, 0.56, 0.333);
  neckGrp.add(p);
});

// Hair
const hair = mkSphere(0.31, mkMat(0x080810, 30));
hair.position.y = 0.68;
hair.scale.set(1.05, 0.58, 1.05);
neckGrp.add(hair);

// Eyebrows
[-0.115, 0.115].forEach(x => {
  const br = mkBox(0.085, 0.018, 0.015, mkMat(0x080810, 20));
  br.position.set(x, 0.63, 0.338);
  br.rotation.z = x > 0 ? 0.18 : -0.18;
  neckGrp.add(br);
});

// ─── ARMS ───────────────────────────────────────────────────
const SY = 0.92, SX = 0.42;
const armMat = mkMat(skinColor, 50);

const rSh = new THREE.Group(); rSh.position.set(SX, SY, 0); spine.add(rSh);
const rUA = mkLimb(0.6, 0.098, armMat); rSh.add(rUA);
const rElb = new THREE.Group(); rElb.position.y = -0.6; rUA.add(rElb);
const rLA = mkLimb(0.5, 0.082, armMat); rElb.add(rLA);
const rHnd = mkSphere(0.09, mkMat(skinColor, 50)); rHnd.position.y = -0.5; rElb.add(rHnd);

const lSh = new THREE.Group(); lSh.position.set(-SX, SY, 0); spine.add(lSh);
const lUA = mkLimb(0.6, 0.098, armMat); lSh.add(lUA);
const lElb = new THREE.Group(); lElb.position.y = -0.6; lUA.add(lElb);
const lLA = mkLimb(0.5, 0.082, armMat); lElb.add(lLA);
const lHnd = mkSphere(0.09, mkMat(skinColor, 50)); lHnd.position.y = -0.5; lElb.add(lHnd);

// ─── LEGS ───────────────────────────────────────────────────
const HX = 0.2;
const legMat = mkMat(clothDark, 50);
const legClothMat = mkMat(0x1a3568, 70);

const rHip = new THREE.Group(); rHip.position.set(HX, 0, 0); root.add(rHip);
const rUL = mkLimb(0.78, 0.125, legClothMat); rHip.add(rUL);
const rKn = new THREE.Group(); rKn.position.y = -0.78; rUL.add(rKn);
const rLL = mkLimb(0.7, 0.1, legClothMat); rKn.add(rLL);
const rAnk = new THREE.Group(); rAnk.position.y = -0.7; rLL.add(rAnk);
const rFoot = mkBox(0.15, 0.1, 0.3, mkMat(clothDark, 40)); rFoot.position.set(0, -0.05, 0.08); rAnk.add(rFoot);

const lHip = new THREE.Group(); lHip.position.set(-HX, 0, 0); root.add(lHip);
const lUL = mkLimb(0.78, 0.125, legClothMat); lHip.add(lUL);
const lKn = new THREE.Group(); lKn.position.y = -0.78; lUL.add(lKn);
const lLL = mkLimb(0.7, 0.1, legClothMat); lKn.add(lLL);
const lAnk = new THREE.Group(); lAnk.position.y = -0.7; lLL.add(lAnk);
const lFoot = mkBox(0.15, 0.1, 0.3, mkMat(clothDark, 40)); lFoot.position.set(0, -0.05, 0.08); lAnk.add(lFoot);

// ─── CAMERA ORBIT ───────────────────────────────────────────
let camR = 7, camTheta = 0.2, camPhi = 0.32;
let isDrag = false, pm = {x:0,y:0};

canvas.addEventListener('mousedown', e => { isDrag=true; pm={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('touchstart', e => { isDrag=true; pm={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
window.addEventListener('mouseup', () => isDrag=false);
window.addEventListener('touchend', () => isDrag=false);
function onDrag(x,y) {
  if(!isDrag) return;
  camTheta -= (x-pm.x)*0.013;
  camPhi = Math.max(0.06, Math.min(1.25, camPhi+(y-pm.y)*0.011));
  pm={x,y};
}
window.addEventListener('mousemove', e => onDrag(e.clientX,e.clientY));
window.addEventListener('touchmove', e => onDrag(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
canvas.addEventListener('wheel', e => {
  camR = Math.max(3, Math.min(14, camR+e.deltaY*0.009));
},{passive:true});

// ─── ANIMATION SYSTEM ───────────────────────────────────────
let mode = 'idle';
const labelEl = document.getElementById('label');
const formulaEl = document.getElementById('formulas');

// ─── FORMULA DEFINITIONS ────────────────────────────────────
const FORMULAS = [
  { key:'idle', title:'IDLE', sections:[
    { name:'Body', rows:[
      ['y',        'BASE_Y + <em>sin</em>(0.85t) × 0.022'],
      ['spine.z',  '<em>sin</em>(0.42t) × 0.03'],
    ]},
    { name:'Head', rows:[
      ['neck.y',   '<em>sin</em>(0.3t) × 0.09'],
      ['neck.x',   '<em>sin</em>(0.5t) × 0.04'],
    ]},
    { name:'Arms', rows:[
      ['rSh.z / lSh.z', '−0.17 / +0.17'],
      ['rElb.x',  '0.12 + <em>sin</em>(0.6t) × 0.04'],
      ['lElb.x',  '0.12 + <em>sin</em>(0.7t) × 0.04'],
    ]},
    { name:'Legs', rows:[
      ['rHip.z',  '+<em>sin</em>(0.42t) × 0.06'],
      ['lHip.z',  '−<em>sin</em>(0.42t) × 0.06'],
    ]},
  ]},
  { key:'walk', title:'WALK  ω=2.8', sections:[
    { name:'Legs', rows:[
      ['rHip.x',  '+<em>sin</em>(ωt) × 0.52'],
      ['lHip.x',  '−<em>sin</em>(ωt) × 0.52'],
      ['rKn.x',   'max(0,+<em>sin</em>(ωt)) × 0.72'],
      ['lKn.x',   'max(0,−<em>sin</em>(ωt)) × 0.72'],
    ]},
    { name:'Arms', rows:[
      ['rSh.x',   '−<em>sin</em>(ωt) × 0.27'],
      ['lSh.x',   '+<em>sin</em>(ωt) × 0.27'],
      ['elb.x',   '0.12'],
    ]},
    { name:'Body', rows:[
      ['y',       'BASE + |<em>sin</em>(2ωt)| × 0.036'],
      ['spine.y', '<em>sin</em>(ωt) × 0.07'],
    ]},
  ]},
  { key:'wave', title:'WAVE  ω=3.5', sections:[
    { name:'R Shoulder', rows:[
      ['rSh.z',   '−1.52 + <em>sin</em>(ωt) × 0.22'],
      ['rSh.x',   '0.1'],
    ]},
    { name:'R Elbow', rows:[
      ['rElb.z',  '−0.35 + <em>sin</em>(ωt+0.6) × 0.18'],
      ['rElb.x',  '0.12'],
    ]},
    { name:'L Arm', rows:[
      ['lSh.z',   '+0.18'],
      ['lElb.x',  '0.08'],
    ]},
    { name:'Body', rows:[
      ['y',       'BASE + <em>sin</em>(0.85t) × 0.022'],
      ['neck.y',  '<em>sin</em>(0.3t) × 0.09'],
    ]},
  ]},
  { key:'dance', title:'DANCE  ω=4.5', sections:[
    { name:'beat = |<em>sin</em>(ωt/2)|^0.5', rows:[]},
    { name:'Body', rows:[
      ['rot.y',   '<em>sin</em>(ωt/2) × 0.38'],
      ['rot.z',   '<em>sin</em>(ωt) × 0.09'],
      ['y',       'BASE + beat × 0.14'],
      ['pos.x',   '<em>sin</em>(ωt/4) × 0.18'],
      ['spine.z', '<em>sin</em>(ωt/2) × 0.14'],
      ['spine.y', '<em>sin</em>(ωt×0.6) × 0.16'],
      ['spine.x', '−beat × 0.12'],
      ['neck.y',  '<em>sin</em>(ωt) × 0.25'],
      ['neck.x',  '−beat × 0.15'],
    ]},
    { name:'Arms', rows:[
      ['rSh.z',   '−0.55 + <em>sin</em>(ωt) × 0.58'],
      ['lSh.z',   '+0.55 + <em>sin</em>(ωt+π) × 0.58'],
      ['rSh.x',   '+<em>cos</em>(ωt) × 0.42'],
      ['lSh.x',   '−<em>cos</em>(ωt) × 0.42'],
      ['elb.x',   '0.7 + <em>sin</em>(1.4ωt) × 0.32'],
      ['elb.z',   '<em>sin</em>(2ωt) × 0.22'],
    ]},
    { name:'Legs', rows:[
      ['rHip.x',  '+<em>sin</em>(ωt) × 0.32'],
      ['lHip.x',  '−<em>sin</em>(ωt) × 0.32'],
      ['rHip.z',  '+<em>sin</em>(ωt/2+0.5) × 0.12'],
      ['lHip.z',  '−<em>sin</em>(ωt/2+0.5) × 0.12'],
      ['kn.x',    'max(0,<em>sin</em>(ωt+0.9)) × 0.55'],
      ['ank.x',   '<em>sin</em>(1.5ωt) × 0.18'],
    ]},
  ]},
  { key:'run', title:'RUN  ω=5.5', sections:[
    { name:'Body', rows:[
      ['y',       'BASE + |<em>sin</em>(2ωt)| × 0.08'],
      ['rot.x',   '−0.1  (前傾)'],
      ['spine.x', '−0.08'],
      ['neck.x',  '+0.08'],
      ['spine.y', '<em>sin</em>(ωt) × 0.1'],
    ]},
    { name:'Arms', rows:[
      ['rSh.x',   '−<em>sin</em>(ωt) × 0.55'],
      ['lSh.x',   '+<em>sin</em>(ωt) × 0.55'],
      ['rElb.x',  '0.6 + <em>sin</em>(ωt) × 0.3'],
      ['lElb.x',  '0.6 − <em>sin</em>(ωt) × 0.3'],
    ]},
    { name:'Legs', rows:[
      ['rHip.x',  '+<em>sin</em>(ωt) × 0.72'],
      ['lHip.x',  '−<em>sin</em>(ωt) × 0.72'],
      ['rKn.x',   'max(0,+<em>sin</em>(ωt)) × 1.0'],
      ['lKn.x',   'max(0,−<em>sin</em>(ωt)) × 1.0'],
    ]},
  ]},
  { key:'break', title:'BREAK  [14s cycle]', sections:[
    { name:'① Toprock  0–2.5s  ω=3.2', rows:[
      ['beat',    '|<em>sin</em>(ωt)|'],
      ['y',       'BASE + beat³ × 0.14'],
      ['spine.x', '−beat × 0.18'],
      ['spine.z', '<em>sin</em>(ωt) × 0.18'],
      ['neck.x',  '−beat × 0.22'],
      ['rHip.x',  '+<em>sin</em>(ωt) × 0.62'],
      ['lHip.x',  '−<em>sin</em>(ωt) × 0.62'],
      ['kn.x',    'max(0, ±<em>sin</em>(ωt)) × 0.85'],
      ['rSh.z',   '−0.55+<em>sin</em>(ωt+0.3)×0.38'],
      ['elb.z',   '<em>sin</em>(2ωt) × 0.25'],
    ]},
    { name:'② Windmill  2.5–6s', rows:[
      ['θ',       'lt × 6π/3.5  (3 rot.)'],
      ['drop',    '<em>clamp</em>(lt×6, 0,1)'],
      ['rot.y',   'θ'],
      ['rot.x',   'lerp(0,−0.72,drop)+<em>sin</em>(θ)×0.42'],
      ['rot.z',   '<em>cos</em>(θ) × 0.52'],
      ['rHip.x',  '0.4+<em>sin</em>(θ+0.15)×1.2'],
      ['lHip.x',  '−0.2+<em>sin</em>(θ+0.15+π)×1.2'],
      ['rSh.z',   '−0.85+<em>sin</em>(θ)×0.9'],
      ['lSh.z',   '+0.85+<em>sin</em>(θ+π)×0.9'],
    ]},
    { name:'③ Headspin  6–9.5s  ω=6.5', rows:[
      ['fi',      '<em>clamp</em>(lt×3.5, 0,1)'],
      ['root.y',  'lerp(0.2, 1.60, fi)'],
      ['rot.x',   'lerp(−0.72, −(π−0.22), fi)'],
      ['rot.y',   'lt×6.5  (spin)'],
      ['rHip.z',  '+0.65+<em>sin</em>(lt×2.8)×0.14'],
      ['lHip.z',  '−0.65−<em>sin</em>(lt×2.8)×0.14'],
      ['rHip.x',  '<em>sin</em>(lt×3.2+0.4)×0.28'],
    ]},
    { name:'④ Air Chair  9.5–11.5s', rows:[
      ['fi',      '<em>clamp</em>(lt×3, 0,1)'],
      ['root.y',  'lerp(1.60, 0.42, fi)'],
      ['rot.x',   'lerp(−(π−0.22),−0.22,fi)'],
      ['rot.z',   'lerp(0, 0.72, fi)'],
      ['rSh.z',   'lerp(−0.52, −π×0.56, fi)'],
      ['lSh.z',   'lerp(+0.52, −0.12, fi)'],
      ['rHip.x',  'lerp(0.28, 1.72, fi)  ↑kick'],
      ['lHip.x',  'lerp(−0.28,−1.2, fi)  ↓tuck'],
      ['lKn.x',   'lerp(0.28, 1.12, fi)'],
      ['wobble',  '<em>sin</em>(11.3t)×0.016+<em>sin</em>(7.1t)×0.009'],
    ]},
    { name:'⑤ Get Up  11.5–14s', rows:[
      ['ui',      '<em>clamp</em>(lt/1.8, 0,1)'],
      ['root.y',  'lerp(0.42, BASE+0.14, ui)'],
      ['rot.z',   'lerp(0.72, 0, ui)'],

function renderFormulas(activeKey) {
  let html = '';
  FORMULAS.forEach(fm => {
    const isActive = fm.key === activeKey;
    html += `<div class="f-mode-block ${isActive ? 'active' : ''}">`;
    html += `<div class="f-title">${fm.title}</div>`;
    fm.sections.forEach(sec => {
      html += `<div class="f-section">`;
      if (sec.name) html += `<div class="f-section-name">${sec.name}</div>`;
      sec.rows.forEach(([joint, eq]) => {
        html += `<div class="f-row"><span class="f-joint">${joint}</span><span class="f-eq">${eq}</span></div>`;
      });
      html += `</div>`;
    });
    html += `</div><div class="f-mode-sep"></div>`;
  });
  formulaEl.innerHTML = html;
  // Scroll active block into view
  const activeEl = formulaEl.querySelector('.f-mode-block.active');
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const ALL_GROUPS = [rSh,lSh,rElb,lElb,rHip,lHip,rKn,lKn,rAnk,lAnk,spine,neckGrp,root];

function resetPose() {
  ALL_GROUPS.forEach(g => g.rotation.set(0,0,0));
  root.position.set(0, BASE_Y, 0);
  // Default arm hang
  rSh.rotation.z = -0.17;
  lSh.rotation.z =  0.17;
  rElb.rotation.x = 0.1;
  lElb.rotation.x = 0.1;
}

// ── Idle ──
function animIdle(t) {
  const b = Math.sin(t * 0.85);
  root.position.y = BASE_Y + b * 0.022;
  neckGrp.rotation.y = Math.sin(t * 0.3) * 0.09;
  neckGrp.rotation.x = Math.sin(t * 0.5) * 0.04;
  spine.rotation.z = Math.sin(t * 0.42) * 0.03;
  // Subtle weight shift
  rHip.rotation.z =  Math.sin(t * 0.42) * 0.06;
  lHip.rotation.z = -Math.sin(t * 0.42) * 0.06;
  rElb.rotation.x = 0.12 + Math.sin(t * 0.6) * 0.04;
  lElb.rotation.x = 0.12 + Math.sin(t * 0.7) * 0.04;
}

// ── Walk ──
function animWalk(t) {
  const sp=2.8, ls=0.52, as=0.27, ks=0.72;
  const r = Math.sin(t*sp), l = -Math.sin(t*sp);
  rHip.rotation.x = r*ls; lHip.rotation.x = l*ls;
  rKn.rotation.x  = Math.max(0, r)*ks; lKn.rotation.x = Math.max(0,l)*ks;
  rSh.rotation.x = -r*as; rSh.rotation.z = -0.17;
  lSh.rotation.x = -l*as; lSh.rotation.z =  0.17;
  rElb.rotation.x = 0.12; lElb.rotation.x = 0.12;
  root.position.y = BASE_Y + Math.abs(Math.sin(t*sp*2))*0.036;
  spine.rotation.y = r * 0.07;
}

// ── Wave ──
function animWave(t) {
  animIdle(t);
  const sp = 3.5;
  rSh.rotation.z = -1.52 + Math.sin(t*sp)*0.22;
  rSh.rotation.x = 0.1;
  rElb.rotation.z = -0.35 + Math.sin(t*sp+0.6)*0.18;
  rElb.rotation.x = 0.12;
  lSh.rotation.z = 0.18;
  lElb.rotation.x = 0.08;
}

// ── Dance ──
function animDance(t) {
  const sp = 4.5;
  const beat = Math.pow(Math.abs(Math.sin(t * sp * 0.5)), 0.5);
  root.rotation.y = Math.sin(t*sp*0.5)*0.38;
  root.rotation.z = Math.sin(t*sp)*0.09;
  root.position.y = BASE_Y + beat * 0.14;
  root.position.x = Math.sin(t*sp*0.25)*0.18;
  spine.rotation.z = Math.sin(t*sp*0.5)*0.14;
  spine.rotation.y = Math.sin(t*sp*0.6)*0.16;
  spine.rotation.x = -beat * 0.12;
  neckGrp.rotation.y = Math.sin(t*sp)*0.25;
  neckGrp.rotation.z = Math.sin(t*sp*1.2)*0.08;
  neckGrp.rotation.x = -beat * 0.15;
  rSh.rotation.z = -0.55 + Math.sin(t*sp)*0.58;
  lSh.rotation.z =  0.55 + Math.sin(t*sp+Math.PI)*0.58;
  rSh.rotation.x =  Math.cos(t*sp)*0.42;
  lSh.rotation.x = -Math.cos(t*sp)*0.42;
  rElb.rotation.x = 0.7 + Math.sin(t*sp*1.4)*0.32;
  lElb.rotation.x = 0.7 + Math.sin(t*sp*1.4+1)*0.32;
  rElb.rotation.z = Math.sin(t*sp*2)*0.22;
  lElb.rotation.z = Math.sin(t*sp*2+1.2)*0.22;
  rHip.rotation.x = Math.sin(t*sp)*0.32;
  lHip.rotation.x = -Math.sin(t*sp)*0.32;
  rHip.rotation.z = Math.sin(t*sp*0.5+0.5)*0.12;
  lHip.rotation.z = -Math.sin(t*sp*0.5+0.5)*0.12;
  rKn.rotation.x = Math.max(0, Math.sin(t*sp+0.9))*0.55;
  lKn.rotation.x = Math.max(0, Math.sin(t*sp+0.9+Math.PI))*0.55;
  rAnk.rotation.x = Math.sin(t*sp*1.5)*0.18;
  lAnk.rotation.x = Math.sin(t*sp*1.5+1)*0.18;
}

// ── Run ──
function animRun(t) {
  const sp=5.5, ls=0.72, as=0.55, ks=1.0;
  const r = Math.sin(t*sp), l = -Math.sin(t*sp);
  rHip.rotation.x = r*ls; lHip.rotation.x = l*ls;
  rKn.rotation.x  = Math.max(0, r)*ks; lKn.rotation.x = Math.max(0,l)*ks;
  rSh.rotation.x = -r*as; rSh.rotation.z = -0.17;
  lSh.rotation.x = -l*as; lSh.rotation.z =  0.17;
  rElb.rotation.x = 0.6 + r*0.3;
  lElb.rotation.x = 0.6 + l*0.3;
  root.position.y = BASE_Y + Math.abs(Math.sin(t*sp*2))*0.08;
  root.rotation.x = -0.1; // forward lean
  spine.rotation.y = r * 0.1;
  spine.rotation.x = -0.08;
  neckGrp.rotation.x = 0.08;
}

// ── Break ──────────────────────────────────────────────────
const ss = x => x*x*(3-2*x);
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a,b,t) => a+(b-a)*ss(clamp01(t));

// Phase 1: Toprock  (0 – 3.5s)
function breakToprock(t, lt) {
  const sp = 3.2;
  const beat = Math.abs(Math.sin(t * sp)); // 0-1 on beat

  // Body bounce — sharp hit on beat
  root.position.y = BASE_Y + Math.pow(beat, 3) * 0.14;
  root.position.x = Math.sin(t * sp * 0.5) * 0.3;

  // Chest pop on beat
  spine.rotation.x = -beat * 0.18;
  spine.rotation.z = Math.sin(t * sp) * 0.18;
  spine.rotation.y = Math.sin(t * sp * 0.6) * 0.22;

  // Head with attitude — nods hard on beat, looks side to side
  neckGrp.rotation.x = -beat * 0.22;
  neckGrp.rotation.y = Math.sin(t * sp * 0.5) * 0.35;
  neckGrp.rotation.z = Math.sin(t * sp * 0.9) * 0.08;

  // Sharp cross-step footwork
  const rs = Math.sin(t * sp), ls = -Math.sin(t * sp);
  rHip.rotation.x =  rs * 0.62;
  lHip.rotation.x =  ls * 0.62;
  rHip.rotation.z =  Math.sin(t * sp * 0.5) * 0.18;
  lHip.rotation.z = -Math.sin(t * sp * 0.5) * 0.18;
  rKn.rotation.x  = Math.max(0,  rs) * 0.85;
  lKn.rotation.x  = Math.max(0, -rs) * 0.85;
  rAnk.rotation.x = Math.sin(t * sp + 0.5) * 0.2;
  lAnk.rotation.x = Math.sin(t * sp - 0.5) * 0.2;

  // Arms: sharp swings with wrist flicks
  rSh.rotation.z = -0.55 + Math.sin(t * sp + 0.3) * 0.38;
  lSh.rotation.z =  0.55 + Math.sin(t * sp + 0.3 + Math.PI) * 0.38;
  rSh.rotation.x =  Math.cos(t * sp) * 0.45;
  lSh.rotation.x = -Math.cos(t * sp) * 0.45;
  rElb.rotation.x = 0.6 + Math.sin(t * sp * 1.8) * 0.35;
  lElb.rotation.x = 0.6 + Math.cos(t * sp * 1.8) * 0.35;
  // wrist pop
  rElb.rotation.z = Math.sin(t * sp * 2) * 0.25;
  lElb.rotation.z = Math.sin(t * sp * 2 + 1) * 0.25;
}

// Phase 2: Windmill — bigger, more dramatic  (2.5 – 6s = 3.5s)
function breakWindmill(t, lt) {
  const spinAngle = lt * (Math.PI * 6 / 3.5); // 3 full rotations in 3.5s

  const dropIn = clamp01(lt * 6);
  root.position.y = lerp(BASE_Y, 0.2, dropIn) + Math.abs(Math.sin(spinAngle * 0.5)) * 0.05;
  root.position.x = Math.sin(spinAngle * 0.4) * 0.15;

  root.rotation.y = spinAngle;
  // Body rolls: strong tilt + rock as if shoulder-on-floor
  root.rotation.x = lerp(0, -0.72, dropIn) + Math.sin(spinAngle) * 0.42;
  root.rotation.z = Math.cos(spinAngle) * 0.52;

  // LEGS: big windmill sweep — fully extended, 1.2 amplitude
  rHip.rotation.x = 0.4  + Math.sin(spinAngle + 0.15) * 1.2;
  lHip.rotation.x = -0.2 + Math.sin(spinAngle + 0.15 + Math.PI) * 1.2;
  rHip.rotation.z = Math.cos(spinAngle * 0.5) * 0.78;
  lHip.rotation.z = -Math.cos(spinAngle * 0.5) * 0.78;
  rKn.rotation.x = 0.15 + Math.max(0, Math.sin(spinAngle + 1.1)) * 0.5;
  lKn.rotation.x = 0.15 + Math.max(0, Math.sin(spinAngle + 1.1 + Math.PI)) * 0.5;
  rAnk.rotation.x = Math.sin(spinAngle * 1.5) * 0.22;
  lAnk.rotation.x = Math.sin(spinAngle * 1.5 + Math.PI) * 0.22;

  // Arms: one plants on floor, one sweeps high
  rSh.rotation.z = -0.85 + Math.sin(spinAngle) * 0.9;
  lSh.rotation.z =  0.85 + Math.sin(spinAngle + Math.PI) * 0.9;
  rSh.rotation.x =  Math.cos(spinAngle) * 0.62;
  lSh.rotation.x = -Math.cos(spinAngle) * 0.62;
  // Elbow only bends when arm is NOT planted into floor
  rElb.rotation.x = 0.2 + Math.max(0, Math.sin(spinAngle + 0.8)) * 0.55;
  lElb.rotation.x = 0.2 + Math.max(0, Math.sin(spinAngle + 0.8 + Math.PI)) * 0.55;

  spine.rotation.x = Math.sin(spinAngle * 0.7) * 0.32;
  spine.rotation.z = Math.cos(spinAngle) * 0.18;
  neckGrp.rotation.y = -spinAngle * 0.25;
  neckGrp.rotation.x = 0.12;
}

// Phase 3: Headspin  (6 – 9.5s = 3.5s)
// Strategy: root.rotation.x ≈ -π  →  body inverted, head at floor
// root.position.y = 1.60  →  head world-y ≈ 0.07
// root.rotation.y = continuous spin  →  body circles around head
function breakHeadspin(t, lt) {
  const spinSpeed = 6.5; // rad/s — about 1 rotation/second
  const spinAngle = lt * spinSpeed;
  const spinIn = clamp01(lt * 3.5);

  // Quick transition: crash from windmill low → invert
  root.position.y = lerp(0.2, 1.60, spinIn);
  root.rotation.x = lerp(-0.72, -(Math.PI - 0.22), spinIn);
  root.rotation.y = spinAngle;
  root.rotation.z = Math.sin(spinAngle * 0.12) * 0.05; // tiny precession wobble

  // LEGS: V-spread upward  (in inverted frame local-down = world-up)
  const spread = 0.65 + Math.sin(lt * 2.8) * 0.14;
  rHip.rotation.z =  spread;
  lHip.rotation.z = -spread;
  rHip.rotation.x = Math.sin(lt * 3.2 + 0.4) * 0.28;
  lHip.rotation.x = Math.sin(lt * 3.2 + 0.4 + Math.PI) * 0.28;
  rKn.rotation.x = 0.28 + Math.sin(lt * 4.5) * 0.12;
  lKn.rotation.x = 0.28 + Math.sin(lt * 4.5 + Math.PI) * 0.12;
  rAnk.rotation.x = Math.sin(lt * 5) * 0.15;
  lAnk.rotation.x = Math.sin(lt * 5 + 1.2) * 0.15;

  // ARMS: spread for angular momentum control
  rSh.rotation.z = -0.52 + Math.sin(spinAngle * 0.35) * 0.18;
  lSh.rotation.z =  0.52 + Math.sin(spinAngle * 0.35 + 1.1) * 0.18;
  rSh.rotation.x = Math.sin(spinAngle * 0.22) * 0.22;
  lSh.rotation.x = Math.cos(spinAngle * 0.22) * 0.22;
  rElb.rotation.x = 0.32 + Math.sin(lt * 2) * 0.1;
  lElb.rotation.x = 0.32 + Math.sin(lt * 2 + 1) * 0.1;

  // Head: trails spin slightly, slight strain tilt
  neckGrp.rotation.y = -spinAngle * 0.04;
  neckGrp.rotation.x = 0.08;
  spine.rotation.z = Math.sin(spinAngle * 0.18) * 0.07;
}

// Phase 4: Air Chair Freeze  (9.5 – 11.5s = 2s)
// Starts from headspin (inverted) and snaps into freeze
function breakFreeze(t, lt) {
  const fi = clamp01(lt * 3.0);

  root.position.y = lerp(1.60, 0.42, fi); // come down from inverted
  root.rotation.y = 0; // STOP spinning — freeze!
  root.rotation.x = lerp(-(Math.PI - 0.22), -0.22, fi);
  root.rotation.z = lerp(0, 0.72, fi);

  // RIGHT arm: weight-bearing, elbow toward floor
  rSh.rotation.z = lerp(-0.52, -Math.PI * 0.56, fi);
  rSh.rotation.x = lerp(0.22, 0.2, fi);
  rElb.rotation.x = lerp(0.32, 0.14, fi);
  rElb.rotation.z = lerp(0, 0.28, fi);

  // LEFT arm: dramatic counterbalance
  lSh.rotation.z = lerp(0.52, -0.12, fi);
  lSh.rotation.x = lerp(0.22, 0.35, fi);
  lElb.rotation.x = lerp(0.32, 0.58, fi);
  lElb.rotation.z = lerp(0, -0.38, fi);

  // RIGHT leg: kick high
  rHip.rotation.x = lerp(0.28, 1.72, fi);
  rHip.rotation.z = lerp(0.65, -0.12, fi);
  rKn.rotation.x  = lerp(0.28, 0.42, fi);

  // LEFT leg: tuck behind
  lHip.rotation.x = lerp(-0.28, -1.2, fi);
  lHip.rotation.z = lerp(-0.65, -0.28, fi);
  lKn.rotation.x  = lerp(0.28,  1.12, fi);
  lAnk.rotation.x = lerp(0.15,  0.32, fi);

  spine.rotation.x = lerp(0, -0.1, fi);
  spine.rotation.z = lerp(0, -0.18, fi);

  // Hold strain: micro-shake grows over time
  const strain = clamp01((lt - 0.4) * 1.5);
  const wobble = (Math.sin(t * 11.3) * 0.016 + Math.sin(t * 7.1) * 0.009) * strain;
  spine.rotation.z  += wobble;
  neckGrp.rotation.y = wobble * 3.5;
  neckGrp.rotation.x = 0.1 + Math.sin(t * 6.5) * 0.04 * strain;
  rSh.rotation.x    += wobble * 1.8;
}

// Phase 5: Get Up  (11.5 – 14s = 2.5s)
function breakGetUp(t, lt) {
  const ui = clamp01(lt / 1.8);

  root.position.y = lerp(0.42, BASE_Y + 0.14, ui);
  root.rotation.x = lerp(-0.22, 0.04, ui);
  root.rotation.z = lerp(0.72, 0, ui);

  rSh.rotation.z = lerp(-Math.PI * 0.56, -0.52, ui);
  lSh.rotation.z = lerp(-0.12, 0.52, ui);
  rSh.rotation.x = lerp(0.2, 0.22, ui);
  lSh.rotation.x = lerp(0.35, 0.22, ui);
  rElb.rotation.x = lerp(0.14, 0.55, ui);
  lElb.rotation.x = lerp(0.58, 0.55, ui);

  rHip.rotation.x = lerp(1.72,  0.1, ui);
  lHip.rotation.x = lerp(-1.2, -0.1, ui);
  rKn.rotation.x  = lerp(0.42,  0.08, ui);
  lKn.rotation.x  = lerp(1.12,  0.08, ui);
  spine.rotation.x = lerp(-0.1, -0.12, ui);

  if (ui > 0.65) {
    const b = (ui - 0.65) / 0.35;
    const sp = 3.2, beat = Math.abs(Math.sin(t * sp));
    root.position.y = lerp(root.position.y, BASE_Y + Math.pow(beat, 3) * 0.14, b);
    spine.rotation.z = Math.sin(t * sp) * 0.18 * b;
    neckGrp.rotation.x = -beat * 0.22 * b;
    neckGrp.rotation.y = Math.sin(t * sp * 0.5) * 0.35 * b;
  }
}

// ── Six Step / Seven Step ──
// Defining feature: hands alternate UP and DOWN while legs circle the body.
// Body in a low push-up / crouch stance (face toward floor).
function animSixSeven(t) {
  const sp = 2.0;
  const θ  = t * sp;

  // Low crouch / push-up stance — body tilts forward toward floor
  root.rotation.x = -0.55;
  root.rotation.y = Math.sin(θ * 0.35) * 0.18;
  root.position.y = 0.95; // ground collision will settle this correctly

  spine.rotation.x  = -0.12;
  spine.rotation.y  = Math.sin(θ * 0.5) * 0.08;
  neckGrp.rotation.x = 0.22;
  neckGrp.rotation.y = Math.sin(θ * 0.4) * 0.12;

  // ── THE MAIN FEATURE: hands pump UP ↕ DOWN alternately ──
  // hb oscillates ±1 twice per leg cycle → snappy hand switch
  const hb = Math.sin(θ * 2);

  // Right arm: DOWN (–1.4) when hb=–1, UP (–0.1) when hb=+1
  rSh.rotation.z = -0.75 + hb * 0.65;
  rSh.rotation.x =  0.28 - hb * 0.08;
  rElb.rotation.x = 0.15 + Math.max(0, -hb) * 0.1; // slight bend when down

  // Left arm: opposite phase — DOWN when right is UP
  lSh.rotation.z =  0.75 - hb * 0.65;
  lSh.rotation.x =  0.28 + hb * 0.08;
  lElb.rotation.x = 0.15 + Math.max(0, hb) * 0.1;

  // ── LEGS: circle around the body ──
  // 120° phase offset → 3 steps per half-revolution each side
  const rφ = θ;
  const lφ = θ + Math.PI * 2 / 3;

  rHip.rotation.x =  Math.sin(rφ) * 0.85;
  rHip.rotation.y =  Math.cos(rφ) * 0.62;
  rHip.rotation.z =  Math.cos(rφ) * 0.40;
  rKn.rotation.x  =  Math.max(0, -Math.sin(rφ - 0.4)) * 0.95;
  rAnk.rotation.x =  Math.sin(rφ + 0.3) * 0.18;

  lHip.rotation.x =  Math.sin(lφ) * 0.85;
  lHip.rotation.y =  Math.cos(lφ) * 0.62;
  lHip.rotation.z = -Math.cos(lφ) * 0.40;
  lKn.rotation.x  =  Math.max(0, -Math.sin(lφ - 0.4)) * 0.95;
  lAnk.rotation.x =  Math.sin(lφ + 0.3) * 0.18;
}

// ── Main break dispatcher  [14s cycle] ──
function animBreak(t) {
  const CYCLE = 14;
  const cp = t % CYCLE;

  if      (cp < 2.5)  breakToprock(t, cp);
  else if (cp < 6.0)  breakWindmill(t, cp - 2.5);   // 3.5s
  else if (cp < 9.5)  breakHeadspin(t, cp - 6.0);   // 3.5s
  else if (cp < 11.5) breakFreeze(t, cp - 9.5);     // 2s
  else                breakGetUp(t, cp - 11.5);      // 2.5s
}

// ─── ARM PENETRATION — SPINE-LOCAL ELLIPSOID CHECK ──────────
// Transform forearm points into spine's LOCAL frame before checking.
// This handles body tilts (windmill, freeze) correctly.
// Torso shape in spine local: ellipse XZ (wider side than deep) × Y range.
const _spineInv = new THREE.Matrix4();
const _lv  = new THREE.Vector3(); // reusable local-space vector
const _h3  = new THREE.Vector3(); // hand world pos
const _e3  = new THREE.Vector3(); // elbow world pos
const _m3  = new THREE.Vector3(); // forearm midpoint world pos

// Ellipse semi-axes in spine local XZ; torso Y span
const E_RX = 0.28, E_RZ = 0.20;  // x wider (side-to-side), z shallower (depth)
const T_Y0 = -0.04, T_Y1 = 1.08; // bottom & top of torso in spine local

function _inTorso(worldPt) {
  _lv.copy(worldPt).applyMatrix4(_spineInv);
  if (_lv.z > 0.12) return false; // reaching FORWARD of body is fine
  if (_lv.y < T_Y0 || _lv.y > T_Y1) return false;
  const ex = _lv.x / E_RX, ez = _lv.z / E_RZ;
  return ex*ex + ez*ez < 1.0;
}

function _fixArm(hnd, elbGrp, shGrp, outwardZ) {
  hnd.getWorldPosition(_h3);
  elbGrp.getWorldPosition(_e3);
  _m3.set((_h3.x+_e3.x)*.5, (_h3.y+_e3.y)*.5, (_h3.z+_e3.z)*.5);

  if (_inTorso(_h3) || _inTorso(_m3) || _inTorso(_e3)) {
    if (elbGrp.rotation.x > 0.05) {
      // First: straighten elbow
      elbGrp.rotation.x = Math.max(0, elbGrp.rotation.x - 0.45);
      elbGrp.rotation.z *= 0.40;
    } else {
      // Elbow already straight → swing shoulder outward along z
      shGrp.rotation.z += outwardZ * 0.22;
    }
    return true; // still needs checking next iteration
  }
  return false;
}

function clampArmsThroughBody() {
  for (let i = 0; i < 7; i++) {
    scene.updateMatrixWorld(true);
    _spineInv.copy(spine.matrixWorld).invert();
    const rP = _fixArm(rHnd, rElb, rSh, -1); // right: outward = more negative z
    const lP = _fixArm(lHnd, lElb, lSh, +1); // left:  outward = more positive z
    if (!rP && !lP) break; // both clear → stop early
  }
}


// ─── GROUND COLLISION ───────────────────────────────────────
// After pose is set, measure world-space Y of all extremities.
// If anything goes underground, lift root up just enough.
const _groundProbes = [rFoot, lFoot, rHnd, lHnd];
const _wp = new THREE.Vector3();

function applyGroundCollision() {
  scene.updateMatrixWorld(true);
  let minY = Infinity;
  _groundProbes.forEach(obj => {
    obj.getWorldPosition(_wp);
    if (_wp.y < minY) minY = _wp.y;
  });
  const FLOOR = 0.04; // tiny clearance so feet sit ON the floor
  if (minY < FLOOR) {
    root.position.y += (FLOOR - minY);
  }
}

function loop(ts) {
  requestAnimationFrame(loop);
  const t = ts * 0.001;

  resetPose();
  switch(mode) {
    case 'idle':  animIdle(t);  break;
    case 'walk':  animWalk(t);  break;
    case 'wave':  animWave(t);  break;
    case 'dance': animDance(t); break;
    case 'run':   animRun(t);   break;
    case 'break':    animBreak(t);    break;
    case 'sixseven': animSixSeven(t); break;
  }

  // Arm penetration clamp — runs after every animation
  clampArmsThroughBody();

  // Ground collision — runs after every animation
  applyGroundCollision();

  // Animated lights
  cyanLight.intensity = 1.3 + Math.sin(t*2.3)*0.2;

  // Camera
  const cx = camR * Math.sin(camTheta) * Math.cos(camPhi);
  const cy = camR * Math.sin(camPhi) + 2;
  const cz = camR * Math.cos(camTheta) * Math.cos(camPhi);
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 1.8, 0);

  // Resize
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
}

loop(0);
</script>
